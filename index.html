    openSheet(`<h2 id="sheet-title">Aggiungi alla schermata Home</h2><div class="card" style="margin-top:12px"><p style="margin:0 0 6px"><b>iPhone (Safari)</b></p><ol style="margin:0;padding-left:20px"><li>Tocca il pulsante Condividi, il quadrato con la freccia.</li><li>Scegli “Aggiungi alla schermata Home”.</li><li>Conferma con “Aggiungi”.</li></ol>
      <p style="margin:14px 0 6px"><b>Android (Chrome)</b></p><ol style="margin:0;padding-left:20px"><li>Tocca il menu con i tre puntini in alto a destra.</li><li>Scegli “Aggiungi a schermata Home”.</li></ol></div>
      <p class="small" style="margin-top:12px">Serve una connessione per mappa, foto e meteo. Le spunte restano salvate sul telefono.</p>`);
  } else if (kind === 'info') {
    openSheet(`<h2 id="sheet-title">Informazioni utili</h2><div class="rows" style="margin-top:12px">
      <button class="row" type="button" data-sheet="book"><span class="ic">${I.cal}</span><span><b>Prenotazioni</b></span></button>
      <button class="row" type="button" data-sheet="tips"><span class="ic">${I.tip}</span><span><b>Consigli pratici</b></span></button>
      <button class="row" type="button" data-sheet="budget"><span class="ic">${I.euro}</span><span><b>Il viaggio in numeri</b></span></button>
      <button class="row" type="button" data-sheet="install"><span class="ic">${I.home}</span><span><b>Aggiungi alla Home</b></span></button></div>
      <p class="small" style="margin-top:14px">Orari e prezzi verificati a fine settembre 2026: riconfermateli prenotando.</p><p class="small">Versione della guida: 1.4 · mappe Esri</p>`);
  }
}

/* ================= MAPPA */
let baseLayer, satLayer, satOn = false;
let map, groups = [], planbGroup, filter = -1, mk = {}, activeMk = null, showB = false;
function initMap() {
  if (map || !window.L) return;
  map = L.map('map', { zoomControl: false }).setView([44.85, 7.9], 9);
  /* Keyless raster basemaps. CARTO now watermarks keyless tiles and OSM blocks requests without Referer,
     and both answer with a normal image, so they are only last-resort fallbacks here. */
  const ATT_ESRI = 'Mappa &copy; <a href="https://www.esri.com">Esri</a>, HERE, Garmin, &copy; OpenStreetMap';
  const BASE = [
    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: ATT_ESRI }],
    ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: ATT_ESRI }],
    ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }]
  ];
  const SAT = ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Immagini &copy; <a href="https://www.esri.com">Esri</a>, Maxar, Earthstar Geographics' }];
  let bi = 0, errs = 0, ok = 0;
  const mkBase = () => { const l = L.tileLayer(BASE[bi][0], BASE[bi][1]);
    l.on('tileload', () => { ok++; });
    l.on('tileerror', () => { errs++; if (errs >= 4 && ok === 0 && bi < BASE.length - 1) { map.removeLayer(l); bi++; errs = 0; baseLayer = mkBase(); if (!satOn) baseLayer.addTo(map); } });
    return l; };
  baseLayer = mkBase().addTo(map);
  satLayer = L.tileLayer(SAT[0], SAT[1]);
  DATA.days.forEach((d, di) => {
    const g = L.layerGroup(), pts = []; let n = 0;
    d.items.forEach(it => {
      if (it.type === 'stop' && it.ll) { n++; it.n = n; if (!isAlt(it)) pts.push(it.ll);
        const m = L.marker(it.ll, { icon: L.divIcon({ className: '', html: `<div class="mk" data-mk="${it.id}" style="background:${DC[di]}">${n}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) });
        m.on('click', () => focusCard(it.id)); g.addLayer(m); mk[it.id] = m; }
      if (it.type === 'resto') it.options.forEach((o, oi) => { if (!o.ll) return;
        const m = L.marker(o.ll, { icon: L.divIcon({ className: '', html: `<div class="mk eat" style="border-color:${DC[di]};color:${DC[di]}">€</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) });
        m.on('click', () => openItem(it.id)); g.addLayer(m); if (!oi) mk[it.id] = m; });
    });
    if (pts.length > 1) g.addLayer(L.polyline(pts, { color: DC[di], weight: 3.5, opacity: .75, dashArray: di === 1 ? '8 7' : null }));
    groups.push(g); g.addTo(map);
  });
  planbGroup = L.layerGroup();
  DATA.areas.forEach(a => [...a.eat, ...a.see].forEach(x => { if (!x.ll) return;
    const m = L.marker(x.ll, { icon: L.divIcon({ className: '', html: `<div class="mk b">${x.type === 'alt-eat' ? '€' : 'B'}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }) });
    m.on('click', () => openItem(x.id)); planbGroup.addLayer(m); mk[x.id] = m; }));
  L.marker(DATA.base.ll, { icon: L.divIcon({ className: '', html: `<div class="mk base"><span>B</span></div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) })
    .bindPopup(`<b>${esc(DATA.base.name)}</b><br>${esc(DATA.base.addr)}<br><a href="${gdir(DATA.base.maps)}" target="_blank" rel="noopener">Naviga</a>`).addTo(map);
  $('#chips').innerHTML = `<button class="mchip" type="button" data-f="-1" aria-pressed="true">Tutto</button>` +
    DATA.days.map((d, i) => `<button class="mchip" type="button" data-f="${i}" aria-pressed="false"><i style="background:${DC[i]}"></i>${DAYNAME[i]}</button>`).join('') +
    `<button class="mchip" type="button" data-b aria-pressed="false"><i style="background:#fff;border:2px dashed var(--green)"></i>Piano B</button>` +
    `<button class="mchip" type="button" data-sat aria-pressed="false">Satellite</button>`;
  $('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-sat')) { satOn = !satOn; b.setAttribute('aria-pressed', satOn); if (satOn) { map.removeLayer(baseLayer); satLayer.addTo(map); } else { map.removeLayer(satLayer); baseLayer.addTo(map); } return; } if (b.hasAttribute('data-b')) { showB = !showB; b.setAttribute('aria-pressed', showB); showB ? planbGroup.addTo(map) : map.removeLayer(planbGroup); fit(); } else setFilter(+b.dataset.f); });
  const car = $('#carousel'); let t;
  car.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => { const r = car.getBoundingClientRect(), cx = r.left + r.width / 2; let best, bd = 1e9;
    $$('.mcard', car).forEach(c => { const b = c.getBoundingClientRect(), dd = Math.abs(b.left + b.width / 2 - cx); if (dd < bd) { bd = dd; best = c; } });
    if (best) highlight(best.dataset.id, true); }, 120); }, { passive: true });
  setFilter(-1);
}
function renderCarousel() {
  const its = DATA.days.flatMap((d, di) => (filter === -1 || filter === di) ? d.items.filter(i => i.type === 'stop' && i.ll) : []);
  $('#carousel').innerHTML = its.map(it => `<button class="mcard" type="button" data-id="${it.id}" data-open="${it.id}" style="--dc:${DC[it.day]}">${ph(it.wiki, DC[it.day], 'thumb')}<span style="min-width:0"><span class="n">${DAYNAME[it.day].slice(0, 3)} · ${it.n}${it.time ? ' · ' + esc(it.time) : ''}</span><b>${esc(it.title)}</b><span class="pl">${esc(it.place)}</span></span></button>`).join('');
  hydrate($('#carousel'));
}
function setFilter(f) {
  filter = f; $$('#chips [data-f]').forEach(c => c.setAttribute('aria-pressed', +c.dataset.f === f));
  groups.forEach((g, i) => (f === -1 || f === i) ? g.addTo(map) : map.removeLayer(g));
  renderCarousel(); fit();
}
function fit() {
  map.invalidateSize();
  const b = L.latLngBounds([DATA.base.ll]);
  groups.forEach((g, i) => { if (filter === -1 || filter === i) g.eachLayer(l => l.getLatLng && b.extend(l.getLatLng())); });
  if (showB) planbGroup.eachLayer(l => b.extend(l.getLatLng()));
  map.fitBounds(b, { paddingTopLeft: [30, 80], paddingBottomRight: [30, 120], maxZoom: 14 });
}
function highlight(id, pan) {
  if (activeMk) activeMk.classList.remove('on');
  const el = document.querySelector(`[data-mk="${id}"]`); if (el) { el.classList.add('on'); activeMk = el; }
  if (pan && mk[id]) map.panTo(mk[id].getLatLng(), { animate: true });
}
function focusCard(id) { const c = document.querySelector(`.mcard[data-id="${id}"]`); if (c) c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); highlight(id, false); }
let userMk;
$('#locate').onclick = () => {
  if (!navigator.geolocation) return toast('Posizione non disponibile');
  navigator.geolocation.getCurrentPosition(p => { const ll = [p.coords.latitude, p.coords.longitude];
    if (userMk) userMk.setLatLng(ll); else userMk = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2a6fdb', fillOpacity: 1 }).addTo(map);
    map.setView(ll, 14); }, () => toast('Consenti l’accesso alla posizione'), { enableHighAccuracy: true, timeout: 10000 });
};

/* ================= PIANO B */
let curArea = null;
function renderPianoB(aid) {
  const now = romeNow(), di = DATA.dates.indexOf(now.date);
  curArea = aid || curArea || (di === 1 ? 'torino' : di === 2 ? 'barolo' : 'barbaresco');
  const a = DATA.areas.find(x => x.id === curArea);
  $('#view-pianob').innerHTML = `
  <div class="pagehead"><h1>Piano B</h1><p>Ristorante pieno, pioggia, voglia di cambiare? Alternative vicine, scelte zona per zona.</p></div>
  <nav class="areas" aria-label="Zone">${DATA.areas.map(x => `<button type="button" data-area="${x.id}" aria-pressed="${x.id === curArea}">${esc(x.name)}</button>`).join('')}</nav>
  <div class="wrap">
    <p class="small" style="margin:12px 0 0">${esc(a.when)}</p>
    <section class="sec" style="margin-top:12px"><h2 class="h2">Cosa vedere al posto di…</h2>
      <div class="scroller">${a.see.map(x => `<button class="seecard press" type="button" data-open="${x.id}">${ph(x.wiki, a.color)}<span class="tx" style="display:block"><h3>${esc(x.name)}</h3><div class="w">${esc(x.where)} · ${esc(x.time)}</div><p>${x.desc}</p></span></button>`).join('')}</div></section>
    <section class="sec" style="margin-top:14px"><h2 class="h2">Dove mangiare se è tutto pieno</h2><p class="lead">Selezione da guide Michelin, Gambero Rosso e Slow Food. Telefonate prima per verificare apertura e posti.</p>
      <div class="eatlist">${a.eat.map(o => eatOpt(o, true)).join('')}</div></section>
  </div>`;
  hydrate($('#view-pianob'));
}

/* ================= SCOPRI */
function renderScopri() {
  const cur = DATA.facts.filter(f => /^\d+$/.test(f.n)), wine = DATA.facts.filter(f => !/^\d+$/.test(f.n)), shop = store.get('shop', []);
  $('#view-scopri').innerHTML = `
  <nav class="subnav" aria-label="Sezioni"><a href="#scopri/curiosita">Curiosità</a><a href="#scopri/vino">Il vino</a><a href="#scopri/spesa">Da portare a casa</a><a href="#scopri/glossario">Glossario</a><a href="#scopri/quiz">Quiz</a></nav>
  <div class="wrap">
    <section class="sec" id="curiosita" style="margin-top:18px"><h1 class="h2" style="font-size:30px">Il Piemonte in ${cur.length} curiosità</h1><p class="lead">Storie da raccontarsi in macchina. Scorrete di lato.</p>
      <div class="scroller">${cur.map(f => `<article class="fact"><div class="n">${f.n}</div><h3>${f.t}</h3><p>${f.p}</p></article>`).join('')}</div></section>
    <section class="sec" id="vino"><h2 class="h2">Il vino delle Langhe, in breve</h2><p class="lead">Degustare in quattro passi, senza essere sommelier.</p>
      <div class="steps">${DATA.steps.map(s => `<div><b>${s.n}</b><h3>${s.t}</h3><p>${s.p}</p></div>`).join('')}</div>
      <div class="acc">${wine.map(f => `<details><summary>${f.t}</summary><p>${f.p}</p></details>`).join('')}</div></section>
    <section class="sec" id="spesa"><h2 class="h2">Cosa portare a casa</h2><p class="lead">Spuntate man mano che comprate.</p>
      <div class="shop">${DATA.shop.map((s, i) => `<label><input type="checkbox" data-shop="${i}" ${shop[i] ? 'checked' : ''}><span><b>${s.what}</b><span class="why">${s.why}</span><span class="where">Dove: ${s.where}</span></span></label>`).join('')}</div>
      <div class="acc">${DATA.boxes.filter(b => /tartufo bianco|imitazioni/i.test(b.t)).map(b => `<details><summary>${b.t}</summary><p>${b.p}</p></details>`).join('')}</div></section>
    <section class="sec" id="glossario"><h2 class="h2">Piccolo glossario piemontese</h2>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="gq" placeholder="Cerca: plin, bonet, cerea…" aria-label="Cerca nel glossario"></label>
      <div id="glist">${DATA.glossary.map(g => `<div class="gsec"><h3>${g.title}</h3><dl>${g.items.map(x => `<div data-g="${esc(strip(x.t + ' ' + x.d).toLowerCase())}"><dt>${x.t}</dt><dd>${x.d}</dd></div>`).join('')}</dl></div>`).join('')}</div></section>
    <section class="sec" id="quiz"><h2 class="h2">Il quiz del viaggio</h2><p class="lead">Da fare sulla strada di casa. Chi vince si riposa dalla guida.</p>
      <div class="quiz">${DATA.quiz.map((q, qi) => `<div class="q" data-q="${qi}"><h3><span>${qi + 1}</span>${q.q}</h3>${q.opts.map((o, oi) => `<button type="button" data-a="${oi}">${o}</button>`).join('')}</div>`).join('')}</div>
      <div class="score"><span id="score"></span><button type="button" id="qreset">Ricomincia</button></div></section>
    <footer class="end">Buon viaggio!</footer>
  </div>`;
  $('#gq').addEventListener('input', e => { const v = e.target.value.trim().toLowerCase();
    $$('#glist [data-g]').forEach(el => el.hidden = v && !el.dataset.g.includes(v));
    $$('#glist .gsec').forEach(s => s.hidden = !$$('[data-g]', s).some(x => !x.hidden)); });
  restoreQuiz();
}
function restoreQuiz() {
  const st = store.get('quiz', {}); let sc = 0;
  $$('.q').forEach(qe => { const qi = +qe.dataset.q, a = st[qi], right = DATA.quiz[qi].a;
    $$('button', qe).forEach(b => { b.className = ''; b.disabled = a != null; if (a != null) { const oi = +b.dataset.a; if (oi === right) b.className = 'ok'; else if (oi === a) b.className = 'ko'; } });
    if (a === right) sc++; });
  const n = Object.keys(st).length, s = $('#score');
  if (s) s.textContent = n === DATA.quiz.length ? `Risultato: ${sc} su ${DATA.quiz.length}${sc >= 10 ? ' · da veri piemontesi!' : ''}` : n ? `${sc} giuste su ${n}` : `${DATA.quiz.length} domande`;
}

/* ================= ROUTER */
const TABS = ['oggi', 'programma', 'mappa', 'pianob', 'scopri'];
function route() {
  let [tab, sub] = location.hash.slice(1).split('/'); if (!TABS.includes(tab)) tab = 'oggi';
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + tab));
  $$('.tabs button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (tab === 'oggi') renderOggi();
  if (tab === 'programma') renderProgramma(sub !== undefined && sub !== '' ? +sub : curDay);
  if (tab === 'mappa') { const first = !map; initMap(); setTimeout(() => { if (!map) return; map.invalidateSize(); if (first) fit(); }, 60); }
  if (tab === 'pianob') renderPianoB(sub);
  if (tab === 'scopri' && !$('#view-scopri').innerHTML) renderScopri();
  if (tab === 'scopri' && sub) requestAnimationFrame(() => { const el = document.getElementById(sub); if (el) el.scrollIntoView(); });
  else window.scrollTo(0, 0);
}
function go(h) { if (location.hash === h) route(); else location.hash = h; }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-day],[data-open],[data-onmap],[data-a],[data-sheet],[data-close],[data-area],#qreset'); if (!t) return;
  if (t.dataset.tab) { go('#' + t.dataset.tab + (t.dataset.tab === 'programma' ? '/' + curDay : '')); }
  else if (t.dataset.day != null) { if (sheet.open) closeSheet(); go('#programma/' + t.dataset.day); }
  else if (t.dataset.open) openItem(t.dataset.open);
  else if (t.dataset.sheet) sheetFor(t.dataset.sheet);
  else if (t.hasAttribute('data-close')) history.back();
  else if (t.dataset.area) renderPianoB(t.dataset.area);
  else if (t.dataset.onmap) { const id = t.dataset.onmap, it = ITEMS[id]; if (sheet.open) { closeSheet(); history.replaceState(null, '', location.hash); }
    go('#mappa'); setTimeout(() => { if (it.day != null) setFilter(it.day); else if (!showB) $('#chips [data-b]').click();
      const m = mk[id]; map.invalidateSize(); if (m) { map.setView(m.getLatLng(), 15); if (it.type === 'stop') focusCard(id); } }, 150); }
  else if (t.dataset.a != null) { const qi = +t.closest('.q').dataset.q, st = store.get('quiz', {}); if (st[qi] != null) return; st[qi] = +t.dataset.a; store.set('quiz', st); restoreQuiz(); }
  else if (t.id === 'qreset') { store.set('quiz', {}); restoreQuiz(); }
});
document.addEventListener('change', e => { const t = e.target;
  if (t.dataset.shop != null) { const s = store.get('shop', []); s[+t.dataset.shop] = t.checked; store.set('shop', s); }
  if (t.dataset.book != null) { const s = store.get('book', []); s[+t.dataset.book] = t.checked; store.set('book', s); if (t.checked) toast('Segnato come prenotato'); } });
window.addEventListener('hashchange', () => { closeSheet(); route(); });
(() => { const di = DATA.dates.indexOf(romeNow().date); if (di >= 0) curDay = di; })();
route();
</script>
