<script>
const DATA = {"days": [{"num": 1, "date": "Venerdì 16 ottobre", "title": "Spumanti, torri e borghi di mattoni", "route": "Padova → Canelli → Barbaresco → Neive → Treiso", "stats": [["~450 km", "in auto"], ["~3 km", "a piedi"], ["Sera", "check-in al B&B"], ["Leggero", "calici"]], "items": [{"type": "stop", "time": "08:00", "title": "Partenza da Padova", "place": "Autostrada A4 e A21, uscita Asti Est", "desc": "<p>Circa 380 km e 4 ore di viaggio: A4 fino a Brescia, poi A21 verso Piacenza, Alessandria e Asti. Dall’uscita di Asti Est mancano circa 30 km di statale tra le prime colline di Moscato. Una sosta caffè a metà strada (area di servizio sulla A21) e si arriva a Canelli per l’ora di pranzo.</p><p>Consiglio: le due auto partono insieme e si danno appuntamento direttamente al ristorante, così un eventuale ritardo non costringe l’altra auto ad aspettare in strada.</p>", "must": [], "curio": null, "info": [["Distanza", "~380 km"], ["Tempo", "~4 h con sosta"], ["Pedaggi", "~€30 per auto (indicativo)"]], "maps": null, "gem": false, "kind": "viaggio", "links": [], "wiki": null}, {"type": "resto", "time": "12:30", "kind": "Pranzo", "title": "Pranzo a Canelli", "options": [{"name": "Osteria d’la Sternia", "where": "Via Villanuova 4, Canelli · tel. 333 4888224", "desc": "Nella parte alta e più antica del paese, ambiente rustico con volte e mattoni. Cucina piemontese classica: carne cruda, tajarin, brasato.", "meta": "Aperto venerdì a pranzo · ~€35–45", "maps": "Osteria d'la Sternia Canelli", "ll": [44.7241, 8.2905]}, {"name": "Enoteca di Canelli – Casa Crippa", "where": "Corso Libertà 65/a, Canelli", "desc": "In un palazzo di fine Ottocento che ospitava una storica cantina. Cucina di territorio rivisitata con garbo, segnalata dalla Guida Michelin. Più cara della prima: da scegliere per un pranzo speciale.", "meta": "Pranzo 12:00–14:00 · ~€60–70, sopra budget", "maps": "Enoteca di Canelli Casa Crippa Corso Libertà 65", "ll": [44.7208, 8.2946]}], "note": "Le cucine chiudono alle 14:00: arrivare entro le 12:45."}, {"type": "stop", "time": "14:00", "title": "Le Cattedrali Sotterranee di Canelli", "place": "Cantine Bosca · Via G. B. Giuliani 23 · Patrimonio UNESCO", "desc": "<p>Sotto le strade di Canelli si snodano chilometri di gallerie scavate nel tufo, con volte in mattoni alte come navate di chiesa: per questo le chiamano <b>“cattedrali”</b>. Qui la temperatura resta tutto l’anno tra 12 e 14 gradi, ideale per far riposare milioni di bottiglie di spumante. Scavate a partire da vecchie cantine e ampliate tra Ottocento e Novecento, scendono fino a circa 32 metri di profondità.</p><p>Dal 2014 sono parte del sito UNESCO dei Paesaggi Vitivinicoli di Langhe-Roero e Monferrato. Le cantine visitabili sono quattro (Bosca, Contratto, Coppo, Gancia); abbiamo scelto <b>Bosca</b>, l’unica ancora guidata dalla famiglia fondatrice, con un percorso scenografico di luci e suoni e un assaggio finale.</p>", "must": ["Le file di bottiglie “in punta” sulle pupitres, dove venivano ruotate a mano ogni giorno", "Il vecchio montacarichi di fine Ottocento che portava le bottiglie in superficie", "Il silenzio e il profumo di cantina: fermarsi un attimo al centro della sala più grande"], "curio": "Il primo spumante italiano nacque proprio a Canelli nel 1865, quando Carlo Gancia applicò al Moscato il metodo appreso in Champagne. Durante l’alluvione del 1994 parte delle gallerie Bosca fu allagata: un piano è ancora oggi inagibile.", "info": [["Orari", "Solo su prenotazione, turni giornalieri"], ["Costo", "da ~€15–20 con assaggio"], ["Tempo", "1 h – 1 h 15"], ["Terreno", "Pianeggiante, qualche gradino; fresco"], ["Prenotare", "bosca.it · 0141 967749"]], "maps": "Bosca Cattedrali Sotterranee Canelli", "gem": false, "kind": "visita", "ll": [44.7199, 8.2887], "links": [["Sito e prenotazioni", "https://www.bosca.it"]], "wiki": "cattedrali"}, {"type": "stop", "time": "", "title": "In alternativa o in aggiunta", "place": "Altre cattedrali di Canelli", "desc": "<p><b>Contratto</b> (Via Giuliani 56) produce Alta Langa metodo classico in gallerie spettacolari, ma la visita con degustazione è più cara (circa €50). <b>Coppo</b> (Via Alba 68) è una cantina di famiglia con un percorso lungo e appassionato. Tutte su prenotazione.</p><p>Chi preferisse evitare le cantine può fare due passi lungo la <b>Sternia</b>, l’antica strada acciottolata che sale al borgo alto di Villanuova: vista sui tetti e sulle colline di Moscato. Attenzione: è ripida e il fondo è irregolare.</p>", "must": [], "curio": null, "info": [], "maps": null, "gem": false, "kind": "sosta", "links": [], "wiki": "canelli"}, {"type": "drive", "text": "Canelli → Barbaresco · ~35 km · 45 min, attraverso Santo Stefano Belbo e Castagnole delle Lanze: una delle strade più belle della zona, tra vigneti a perdita d’occhio. <b>Occhio al cartello di Santo Stefano Belbo:</b> qui nacque nel 1908 lo scrittore Cesare Pavese, che ambientò su queste colline il suo romanzo più famoso, <i>La luna e i falò</i>. La sua casa natale è oggi un piccolo museo."}, {"type": "stop", "time": "16:00", "title": "Barbaresco e la sua torre", "place": "Torre di Barbaresco · Piazza del Municipio", "desc": "<p>Barbaresco è un paese di poche centinaia di abitanti che dà il nome a uno dei vini più celebri del mondo. Si parcheggia all’ingresso e si percorre l’unica via principale, Via Torino, fino alla <b>torre medievale</b>: 36 metri di mattoni costruiti intorno all’anno Mille come vedetta sul Tanaro, contesa per secoli tra Alba e Asti.</p><p>Un ascensore porta quasi fino in cima, alla terrazza panoramica: da lassù si vedono il fiume, Alba, Neive, Treiso (dove dormiremo) e, nelle giornate limpide, l’arco delle Alpi. Sulla terrazza si può assaggiare un calice di Barbaresco (circa €5).</p>", "must": ["La terrazza della torre con il panorama a 360° sulle Langhe", "L’Enoteca Regionale del Barbaresco, allestita dentro l’ex chiesa di San Donato: altare e navata sono rimasti, al posto dei banchi ci sono le bottiglie", "Il belvedere dietro la torre, che guarda dritto sulla curva del Tanaro"], "curio": "La zona del Barbaresco DOCG comprende solo Barbaresco, Neive, Treiso e una frazione di Alba. In altre parole: il vino della cena di stasera nasce letteralmente sotto le finestre del B&B.", "info": [["Orari", "Tutti i giorni 10:00–18:00"], ["Costo", "~€6 (ridotto €5)"], ["Tempo", "45 min – 1 h"], ["Terreno", "Via lastricata in leggera salita; ascensore"], ["Nota", "Chiude alle 18: non arrivare dopo le 17:15"]], "maps": "Torre di Barbaresco", "gem": false, "kind": "visita", "ll": [44.7254, 8.0813], "links": [], "wiki": "barbaresco"}, {"type": "drive", "text": "Barbaresco → Neive · ~6 km · 10 min."}, {"type": "stop", "time": "17:30", "title": "Neive, borgo di mattoni al tramonto", "place": "Neive Borgo Alto · Borghi più belli d’Italia", "desc": "<p>Neive è uno dei <b>Borghi più belli d’Italia</b>: un piccolo borgo circolare in cima alla collina, fatto di mattoni rossi, palazzi nobiliari, vicoli che si avvolgono attorno alla torre dell’orologio. Alla luce del tardo pomeriggio d’ottobre i muri si accendono di arancio, ed è il momento perfetto per visitarlo.</p><p>Parcheggiate nel borgo basso o nel parcheggio sotto le mura e salite a piedi: in dieci minuti si è in Piazza Italia. Tramonto intorno alle 18:40.</p>", "must": ["Piazza Italia e la Torre dell’Orologio", "La <i>Bottega dei Quattro Vini</i>: Neive è uno dei pochissimi comuni dove nascono quattro vini DOC/DOCG (Barbaresco, Barbera, Dolcetto, Moscato)", "Il giro delle mura con vista sulle colline di Barbaresco"], "curio": "Neive ebbe il suo momento di gloria nell’Ottocento, quando il conte di Castelborgo chiamò un enologo francese, Louis Oudart, a vinificare il Nebbiolo “alla francese”: è una delle tappe che hanno portato alla nascita del Barbaresco come lo conosciamo.", "info": [["Orari", "Borgo sempre accessibile"], ["Costo", "Gratuito"], ["Tempo", "1 h – 1 h 15"], ["Terreno", "Salita breve ma ripida; lastricato e acciottolato"], ["Consiglio", "Scarpe con buona suola"]], "maps": "Neive Piazza Italia", "gem": false, "kind": "passeggiata", "ll": [44.7262, 8.1158], "links": [], "wiki": "neive"}, {"type": "stop", "time": "19:00", "title": "Arrivo al B&B Mermaid", "place": "Via Meruzzano 16/a, Treiso", "desc": "<p>Da Neive sono circa 10 km (15 minuti). Check-in, un attimo di riposo e si riparte per la cena, che è a pochi minuti.</p><p><b>Chicca per chi ha ancora energia (o per sabato mattina presto):</b> le <b>Rocche dei Sette Fratelli</b>, a pochi minuti dal B&amp;B. Sono pareti di arenaria erose che precipitano in un vallone boscoso. La leggenda racconta di sette fratelli che, per aver lavorato nel giorno di festa sfidando il cielo, furono inghiottiti dalla terra proprio qui. Si ammirano bene dal bordo della strada e dal belvedere segnalato; il sentiero vero e proprio è da evitare se bagnato.</p>", "must": [], "curio": null, "info": [["Distanza", "Neive → Treiso ~10 km"], ["Rocche", "Belvedere gratuito, 15–20 min"]], "maps": "Rocche dei Sette Fratelli Treiso", "gem": true, "kind": "sosta", "ll": [44.6905, 8.0786], "links": [], "wiki": "treiso"}, {"type": "resto", "time": "20:00", "kind": "Cena", "title": "Cena a Treiso", "options": [{"name": "Osteria dell’Unione", "where": "Via Alba 1, Treiso · tel. 0173 638303", "desc": "Una delle osterie più amate delle Langhe, nata come circolo di paese. Cucina di casa, tajarin tirati a mano, coniglio al Barbaresco. Pochi coperti: prenotare con largo anticipo.", "meta": "Venerdì 19:30–23:00 · ~€40–50", "maps": "Osteria dell'Unione Treiso", "ll": [44.6897, 8.0878]}, {"name": "Osteria Le Rocche", "where": "Viale Rimembranza 1, Treiso · tel. 0173 638017", "desc": "In paese, a pochi minuti dal B&B. Cucina piemontese tradizionale e buona scelta di vini del Barbaresco, anche al calice.", "meta": "Venerdì 19:30–22:00 · ~€35–45", "maps": "Osteria Le Rocche Treiso Viale Rimembranza", "ll": [44.6889, 8.0871]}], "note": null}], "timeline": [["08:00", "Partenza"], ["12:15", "Arrivo Canelli"], ["12:30", "Pranzo"], ["14:00", "Cattedrali sotterranee"], ["16:00", "Torre di Barbaresco"], ["17:30", "Neive al tramonto"], ["19:00", "B&B"], ["20:00", "Cena a Treiso"]], "budget": {"rows": [["Pranzo a Canelli", "€35–50"], ["Cattedrali Sotterranee (Bosca)", "~€15–20"], ["Torre di Barbaresco", "€6"], ["Cena a Treiso", "€35–50"], ["Pedaggi e carburante (per auto, da dividere per coppia)", "~€90 / auto"]], "total": "~€95–130"}}, {"num": 2, "date": "Sabato 17 ottobre", "title": "Torino, tra Fiat, portici e grissini", "route": "Treiso → Mirafiori → Lingotto → centro (a piedi) → Treiso", "stats": [["~170 km", "in auto A/R"], ["~8 km", "a piedi"], ["2", "parcheggi"], ["Pianura", "tutto piano"]], "items": [{"type": "stop", "time": "08:40", "title": "Verso Torino, entrando dalla città della Fiat", "place": "Treiso → Mirafiori → Lingotto → Lungo Po → Piazza Vittorio", "desc": "<p>Si parte 5 minuti prima del previsto. Invece di puntare dritti al centro, si imposta sul navigatore un percorso con due tappe intermedie (il QR code qui a fianco apre già l’intero itinerario in Google Maps): <b>Corso Giovanni Agnelli 200</b> e il <b>Lingotto</b>. Dall’autostrada A6 si prende la tangenziale sud e si entra nel quartiere di Mirafiori.</p><p>Dopo il Lingotto si raggiunge il centro percorrendo il <b>Corso Massimo d’Azeglio</b>, lungo il Po: sulla destra scorrono il Parco del Valentino, il <b>Castello del Valentino</b> (residenza sabauda, oggi Facoltà di Architettura) e le torri del <b>Borgo Medievale</b>, la finta cittadella costruita per l’Esposizione del 1884. Un bel colpo d’occhio senza scendere dall’auto.</p>", "must": [], "curio": null, "info": [["Treiso → Mirafiori", "~75 km · 1 h 05"], ["Mirafiori → Lingotto", "~3 km · 10 min"], ["Lingotto → P.za Vittorio", "~5 km · 15 min"], ["Parcheggio finale", "Sotterraneo di Piazza Vittorio Veneto, ~€20–25 la giornata (indicativo)"], ["Attenzione", "ZTL in centro: non entrare in auto"]], "maps": null, "gem": false, "kind": "viaggio", "route": "https://www.google.com/maps/dir/?api=1&origin=Via+Meruzzano+16+Treiso&destination=Parcheggio+Piazza+Vittorio+Veneto+Torino&waypoints=Corso+Giovanni+Agnelli+200+Torino%7CVia+Ermanno+Fenoglietti+15+Torino&travelmode=driving", "links": [], "wiki": "valentino"}, {"type": "stop", "time": "09:45", "title": "La sede storica della Fiat a Mirafiori", "place": "Corso Giovanni Agnelli 200 · solo passaggio in auto", "desc": "<p>Si passa davanti alla <b>palazzina uffici di Mirafiori</b>, per decenni il quartier generale della Fiat e oggi sede Stellantis. Dietro si estende lo stabilimento di Mirafiori, inaugurato nel 1939: per estensione è stato a lungo una delle più grandi fabbriche d’Europa, una vera città nella città, con decine di migliaia di operai nei suoi anni d’oro. Da qui sono uscite la 600, la 500, la 124, la Panda e la Uno.</p><p>È un’area aziendale: si guarda dall’auto (o con una breve sosta fotografica accostando dove consentito), senza entrare.</p>", "must": [], "curio": "Il corso prende il nome da Giovanni Agnelli, uno dei soci fondatori della Fabbrica Italiana Automobili Torino nel 1899. Il nipote omonimo, l’“Avvocato”, guidò l’azienda dal 1966 al 1996 e fu per decenni il volto dell’industria italiana.", "info": [["Tempo", "5–10 min (in auto)"], ["Costo", "Gratuito"], ["Nota", "Area privata: nessuna visita"]], "maps": "Corso Giovanni Agnelli 200 Torino", "gem": false, "kind": "viaggio", "ll": [45.0338, 7.6428], "links": [], "wiki": "mirafiori"}, {"type": "stop", "time": "10:00", "title": "Il Lingotto e la Pista 500", "place": "Accesso Rampa Nord: Via Ermanno Fenoglietti 15 (di fronte a Eataly)", "desc": "<p>Il <b>Lingotto</b>, costruito tra il 1916 e il 1923, fu la fabbrica più moderna d’Europa: lunga mezzo chilometro, pensata in verticale. Le materie prime entravano al piano terra e, piano dopo piano, diventavano automobili, che salivano lungo due rampe elicoidali fino al tetto, dove c’era la <b>pista di collaudo</b>: due rettilinei e due curve paraboliche sopraelevate, a 28 metri di altezza. Dopo la chiusura nel 1982, Renzo Piano l’ha trasformato in centro congressi, hotel, centro commerciale e sede della Pinacoteca Agnelli.</p><p>Oggi sul tetto c’è la <b>Pista 500</b>: il giardino pensile più grande d’Italia, con oltre 40.000 piante e installazioni d’arte, da percorrere a piedi lungo la vecchia pista, con vista sulla collina e sulle Alpi. Si sale in ascensore. Per un caffè panoramico c’è il FIATCafé500, e dall’altra parte della strada il primo <b>Eataly</b> del mondo (2007), nella ex fabbrica Carpano del vermouth.</p>", "must": ["Camminare sulla curva sopraelevata della pista", "La vista sulla collina di Superga e, nelle giornate limpide, sulle Alpi", "Uno sguardo alle rampe elicoidali da cui salivano le auto"], "curio": "Sulla pista del Lingotto fu girato l’inseguimento più famoso di <i>The Italian Job</i> (1969), con tre Mini Cooper che sfrecciano sul tetto. Le Corbusier la definì uno degli spettacoli più impressionanti mai offerti dall’industria.", "info": [["Orari", "Mar–dom 10:00–19:00; da Rampa Nord ultimo ingresso ~17:00"], ["Costo", "Solo Pista: pochi euro (~€3–4); con Pinacoteca ~€12–15"], ["Tempo", "45 min – 1 h"], ["Terreno", "Piano; ascensore"], ["Parcheggio", "Centro commerciale Lingotto"]], "maps": "Pista 500 Lingotto Via Ermanno Fenoglietti 15 Torino", "gem": true, "kind": "visita", "ll": [45.0327, 7.6661], "links": [["Pinacoteca Agnelli", "https://www.pinacoteca-agnelli.it/pista-500/"]], "wiki": "lingotto"}, {"type": "tip", "title": "Per gli appassionati", "text": "A 2 km dal Lingotto c’è il <b>MAUTO</b>, Museo Nazionale dell’Automobile (Corso Unità d’Italia 40), tra i più belli al mondo nel suo genere: ~1 h 30. Da tenere presente per un’altra occasione, o in sostituzione della parte del mattino in centro."}, {"type": "stop", "time": "11:10", "title": "Piazza Vittorio e Via Po", "place": "Da Piazza Vittorio Veneto a Piazza Castello · ~1 km", "desc": "<p><b>Piazza Vittorio</b> è una delle piazze porticate più grandi d’Europa, aperta sul Po e sulla chiesa della Gran Madre dall’altra parte del fiume. Da qui si imbocca <b>Via Po</b>, la strada dei caffè storici e delle librerie antiquarie: i portici furono costruiti apposta perché la famiglia reale potesse arrivare al fiume senza bagnarsi sotto la pioggia.</p>", "must": [], "curio": "Torino ha oltre 18 km di portici, di cui più di 12 continui: si può attraversare quasi tutto il centro senza aprire l’ombrello.", "info": [["Tempo", "20 min a passo tranquillo"], ["Terreno", "Piano, porticato"]], "maps": "Via Po Torino", "gem": false, "kind": "passeggiata", "ll": [45.0679, 7.6909], "links": [], "wiki": "pzvittorio"}, {"type": "stop", "time": "11:30", "title": "Piazza Castello e la Torino dei Savoia", "place": "Palazzo Madama · Palazzo Reale · Galleria Subalpina", "desc": "<p>Il cuore del potere sabaudo. Al centro della piazza, <b>Palazzo Madama</b> ha due facce: una medievale con torri, l’altra barocca, firmata da Filippo Juvarra. Sul lato nord, dietro la cancellata con i Dioscuri, il <b>Palazzo Reale</b>, residenza dei Savoia per oltre due secoli (oggi Musei Reali: ne ammiriamo la facciata e il cortile, senza entrare, per non togliere tempo al resto).</p><p>Pausa caffè obbligatoria in uno dei due gioielli sulla piazza: la <b>Galleria Subalpina</b>, passaggio coperto in ferro e vetro del 1874 con il Caffè Baratti &amp; Milano, oppure il minuscolo <b>Caffè Mulassano</b>, tutto legni e specchi.</p>", "must": ["Le due facciate di Palazzo Madama (girarci intorno)", "La Galleria Subalpina e le sue vetrine di cioccolato", "Un <i>tramezzino</i> da Mulassano, dove fu inventato"], "curio": "Il tramezzino nacque proprio da Mulassano nel 1926. Il nome lo inventò Gabriele D’Annunzio, per italianizzare l’inglese “sandwich”.", "info": [["Tempo", "30 min"], ["Costo", "Gratuito (caffè ~€2–4)"], ["Terreno", "Piano"]], "maps": "Galleria Subalpina Torino", "gem": false, "kind": "passeggiata", "ll": [45.0703, 7.6864], "links": [], "wiki": "pzcastello"}, {"type": "stop", "time": "12:00", "title": "Duomo e Porta Palatina", "place": "Piazza San Giovanni · Parco archeologico", "desc": "<p>Il <b>Duomo di San Giovanni</b> è l’unica chiesa rinascimentale di Torino, sobria e bianca. Accanto svetta la cupola a spirale della Cappella della Sindone di Guarini. La Sindone non è esposta, ma in una cappella laterale della navata sinistra c’è una riproduzione a grandezza naturale con la spiegazione della sua storia.</p><p>Pochi passi più avanti, la <b>Porta Palatina</b>: due torri romane del I secolo a.C., tra le porte di epoca augustea meglio conservate al mondo. Ricordano che Torino nacque come accampamento romano, <i>Augusta Taurinorum</i>, e il reticolo a scacchiera delle strade del centro è ancora quello.</p>", "must": [], "curio": "Nella notte tra l’11 e il 12 aprile 1997 un incendio devastò la Cappella della Sindone: i vigili del fuoco salvarono la reliquia spaccando a martellate la teca antiproiettile. Il restauro della cupola di Guarini è durato 21 anni e si è concluso solo nel 2018.", "info": [["Duomo", "Ingresso libero"], ["Porta Palatina", "Esterno libero"], ["Tempo", "20 min"], ["Terreno", "Piano"]], "maps": "Porta Palatina Torino", "gem": false, "kind": "visita", "ll": [45.0741, 7.6847], "links": [], "wiki": "duomo"}, {"type": "stop", "time": "12:20", "title": "Porta Palazzo e il Balon", "place": "Piazza della Repubblica · Borgo Dora", "desc": "<p><b>Porta Palazzo</b> è il mercato all’aperto più grande d’Europa: centinaia di banchi di frutta, verdura, formaggi, spezie, e la tettoia dell’Orologio con i contadini che vendono i loro prodotti. Il sabato è il giorno migliore, rumoroso e vivissimo: è la Torino vera, lontana dalle cartoline.</p><p>Proprio dietro, nel <b>Borgo Dora</b>, ogni sabato si tiene il <b>Balon</b>, il mercato delle pulci: mobili, vecchie cartoline, dischi, cianfrusaglie. È il quartiere del pranzo.</p>", "must": ["Il padiglione dei formaggi e quello del pesce, con le strutture liberty in ferro", "Gli stand del Balon lungo Via Borgo Dora", "Il Cortile del Maglio, vecchio arsenale oggi pieno di botteghe"], "curio": "Il nome “Porta Palazzo” ricorda un’antica porta della città, la Porta Palatina, che si apriva qui vicino. Il mercato esiste dal Settecento e ogni giorno ci lavorano centinaia di banchi: è anche il luogo dove si sentono più lingue di tutta Torino, specchio delle ondate migratorie che hanno fatto la città, dal Sud Italia negli anni della Fiat fino a oggi.", "info": [["Orari", "Sabato tutto il giorno (meglio il mattino)"], ["Costo", "Gratuito"], ["Tempo", "40 min"], ["Terreno", "Piano; molta folla, occhio a borse e portafogli"]], "maps": "Mercato di Porta Palazzo Torino", "gem": true, "kind": "passeggiata", "ll": [45.0768, 7.6828], "links": [], "wiki": "portapalazzo"}, {"type": "resto", "time": "13:00", "kind": "Pranzo", "title": "Pranzo a Torino", "options": [{"name": "Trattoria Valenza", "where": "Via Borgo Dora 39 · tel. 011 521 3914", "desc": "Trattoria di famiglia nel cuore del Balon: piatti semplici e abbondanti, menu solo in italiano, atmosfera da osteria di una volta. Sala piccola, prenotare.", "meta": "Sabato pranzo dalle 12:00 · ~€30–40", "maps": "Trattoria Valenza Via Borgo Dora 39 Torino", "ll": [45.0784, 7.6819]}, {"name": "Porto di Savona", "where": "Piazza Vittorio Veneto 2 · tel. 011 817 3500", "desc": "Uno dei ristoranti più antichi della città (dal 1863), Locale Storico d’Italia. A pranzo propone anche piatti unici settimanali. Più lontano dal percorso del mattino, ma comodo se si preferisce tornare verso l’auto.", "meta": "Sabato 12:15–15:00 · ~€35–45", "maps": "Porto di Savona Piazza Vittorio Veneto 2 Torino", "ll": [45.0656, 7.6931]}], "note": null}, {"type": "stop", "time": "14:40", "title": "Santuario della Consolata e il Bicerin", "place": "Piazza della Consolata · Caffè Al Bicerin", "desc": "<p>Il Santuario della Consolata è la chiesa più amata dai torinesi, un’esplosione di marmi e ori barocchi a cui lavorarono sia Guarini sia Juvarra. Ma la vera chicca è il <b>corridoio degli ex voto</b>: centinaia di tavolette dipinte a mano, per grazia ricevuta, che raccontano incidenti di tram, cadute da cavallo, guarigioni, guerre. Un pezzo di storia popolare commovente e poco conosciuto.</p><p>Di fronte, il minuscolo <b>Caffè Al Bicerin</b>, aperto nel 1763: otto tavolini di marmo e boiserie. Qui si beve il <b>bicerin</b>, la bevanda simbolo di Torino: caffè, cioccolato e crema di latte, serviti a strati in un bicchierino, da non mescolare.</p>", "must": [], "curio": "Tra i clienti abituali del Bicerin c’era Camillo Benso di Cavour, che durante la messa alla Consolata aspettava la famiglia reale seduto a questi tavolini.", "info": [["Consolata", "Ingresso libero"], ["Bicerin", "~€7; chiuso il mercoledì (sabato aperto)"], ["Tempo", "45 min"], ["Nota", "Al Bicerin si fa spesso un po’ di coda"]], "maps": "Caffè Al Bicerin Piazza della Consolata Torino", "gem": true, "kind": "visita", "ll": [45.0766, 7.6786], "links": [], "wiki": "consolata"}, {"type": "stop", "time": "15:20", "title": "Quadrilatero, Via Garibaldi e Piazza Carignano", "place": "Via Garibaldi → Piazza Carignano", "desc": "<p>Si scende attraverso il <b>Quadrilatero Romano</b>, il quartiere più antico, e si imbocca <b>Via Garibaldi</b>, lunga strada pedonale verso Piazza Castello. Poi una deviazione verso <b>Piazza Carignano</b>, piccola e raccolta, una delle più belle della città: la facciata ondulata in mattoni di <b>Palazzo Carignano</b>, opera di Guarini, dove sedette il primo Parlamento italiano nel 1861 e dove nacque il re Vittorio Emanuele II.</p><p>Sulla stessa piazza si affaccia il <b>Ristorante Del Cambio</b>, aperto nel 1757, uno dei ristoranti più antichi d’Italia: è qui accanto la prossima tappa.</p>", "must": [], "curio": "Al Del Cambio c’è ancora il tavolo dove sedeva Cavour: da lì, attraverso la finestra, poteva tenere d’occhio il Parlamento. Si racconta che i messi gli portassero le notizie direttamente a tavola.", "info": [["Tempo", "30 min"], ["Costo", "Gratuito"], ["Terreno", "Piano, pedonale"]], "maps": "Piazza Carignano Torino", "gem": false, "kind": "passeggiata", "ll": [45.0698, 7.6852], "links": [], "wiki": "carignano"}, {"type": "stop", "time": "15:50", "title": "Farmacia del Cambio", "place": "Piazza Carignano 2", "desc": "<p>Nei locali della storica <b>Farmacia Bestente</b>, aperta nel 1833, con le boiserie e le scaffalature originali dove un tempo stavano i vasi di spezie e medicamenti. Dal 2014 è la pasticceria-caffetteria del Ristorante Del Cambio, curata dallo chef stellato Matteo Baronetto: è la versione “prêt-à-porter” del grande ristorante.</p><p>Perfetta per una pausa dolce a metà pomeriggio: un caffè o una cioccolata, un pasticcino, i gianduiotti e i <i>Sassi di Piazza Carignano</i>. Si possono comprare anche dolci e confezioni da portare a casa. Nella bella stagione il dehors guarda dritto su Palazzo Carignano.</p>", "must": ["Gli arredi della vecchia farmacia", "La vetrina della pasticceria: una piccola pasta a testa, da condividere per assaggiarne di più", "Le sue celebri brioche dalle forme insolite (il cubo, la sfera): vanno spesso a ruba entro la mattina"], "curio": null, "info": [["Orari", "Tutto il giorno, dalla colazione all’aperitivo (verificare)"], ["Costo", "Caffè + pasticcino ~€8–12"], ["Tempo", "20–30 min"], ["Nota", "Il sabato pomeriggio può esserci attesa per un tavolo"]], "maps": "Farmacia del Cambio Piazza Carignano 2 Torino", "gem": false, "kind": "sosta", "ll": [45.0694, 7.6847], "links": [], "wiki": "pzcarignano"}, {"type": "stop", "time": "16:10", "title": "Grissini torinesi e Piazza San Carlo", "place": "Perino Vesco · Via Cavour 10 → Piazza San Carlo", "desc": "<p>A 5 minuti a piedi, di fronte a Palazzo Cavour, <b>Perino Vesco</b> è una “boutique del pane” molto amata dai torinesi: pani con lievito madre, farine biologiche e, soprattutto, <b>grissini stirati a mano</b>, oltre alla torta di nocciole langarola. Il posto giusto per comprare grissini veri da portare a casa. In alternativa, i banchi dei panettieri di Porta Palazzo, al mattino.</p><p>Da qui si torna verso <b>Piazza San Carlo</b>, il “salotto di Torino”, con le due chiese gemelle, la statua equestre di Emanuele Filiberto e i caffè storici sotto i portici, e si risale verso la Mole.</p>", "must": ["Grissini <i>stirati</i> (lunghi e irregolari, tirati a mano) e <i>rubatà</i> (più corti e rustici, arrotolati): prenderne un sacchetto di entrambi per confrontarli", "Il colpo d’occhio su Piazza San Carlo dalle chiese gemelle"], "curio": "Il grissino nacque a Torino nel 1679: il fornaio di corte Antonio Brunero lo inventò su indicazione del medico reale per il piccolo Vittorio Amedeo II, che non digeriva la mollica. Napoleone ne andava matto e li chiamava <i>les petits bâtons de Turin</i>. E sotto i portici di San Carlo, davanti al Caffè Torino, cercate il toro rampante in ottone nel pavimento: portano fortuna tre giri sul tallone… proprio sui suoi attributi.", "info": [["Orari", "Sabato, verificare orario pomeridiano"], ["Costo", "Grissini ~€3–6 al sacchetto (indicativo)"], ["Tempo", "30 min"], ["Terreno", "Piano, porticato"], ["Mole", "Da San Carlo alla Mole ~12 min a piedi"]], "maps": "Perino Vesco Via Cavour 10 Torino", "gem": true, "kind": "visita", "ll": [45.0662, 7.6858], "links": [], "wiki": "sancarlo"}, {"type": "stop", "time": "16:45", "title": "La Mole Antonelliana", "place": "Via Montebello 20 · solo ascensore panoramico", "desc": "<p>Il simbolo di Torino. Alessandro Antonelli iniziò a costruirla nel 1863 come <b>sinagoga</b> per la comunità ebraica, ma il progetto crebbe tanto in altezza (e in costi) che la comunità la cedette al Comune. Completata nel 1889, con i suoi 167,5 metri è stata a lungo l’edificio in muratura più alto del mondo.</p><p>Oggi ospita il Museo Nazionale del Cinema. Noi saliamo solo con l’<b>ascensore panoramico</b>: una cabina di vetro sospesa a cavi d’acciaio che attraversa il vuoto della grande aula centrale e in circa un minuto porta al tempietto a 85 metri. Da lassù: i tetti, la collina, il Po e, se il cielo è limpido, tutta la corona delle Alpi con il Monviso.</p>", "must": ["La salita nella cabina trasparente, con la vista dall’interno della cupola", "Il giro completo del terrazzino panoramico", "Cercare dall’alto Piazza Vittorio e la Gran Madre, la prossima tappa"], "curio": "La Mole compare sulla moneta italiana da 2 centesimi di euro. E la stella sulla punta non è l’originale: nel 1953 una tempesta fece crollare gli ultimi 47 metri della guglia, poi ricostruiti in acciaio.", "info": [["Orari", "9:00–19:00, chiuso il martedì; biglietteria fino alle 18:00"], ["Costo", "Ascensore €9 (museo + ascensore €20)"], ["Tempo", "45 min – 1 h"], ["Prenotare", "Online, fascia 16:45: nel weekend le code sono lunghe"], ["Terreno", "Ascensore; terrazza stretta"]], "maps": "Mole Antonelliana Torino", "gem": false, "kind": "visita", "ll": [45.069, 7.6932], "links": [["Biglietti ascensore", "https://www.museocinema.it"]], "wiki": "mole"}, {"type": "stop", "time": "17:50", "title": "Gran Madre, tramonto e aperitivo", "place": "Ponte Vittorio Emanuele I · Piazza Gran Madre di Dio", "desc": "<p>Si torna in Piazza Vittorio e si attraversa il ponte sul Po. La <b>Gran Madre di Dio</b> è un tempio neoclassico ispirato al Pantheon di Roma, costruito per celebrare il ritorno del re Vittorio Emanuele I dopo la caduta di Napoleone. Dalla scalinata si gode la vista più bella su Piazza Vittorio e sulla Mole appena visitata, con il sole che tramonta alle spalle (verso le 18:40).</p><p>Poi, l’<b>aperitivo</b>: Torino lo ha inventato. Si ordina un <b>vermouth</b> (rosso, con scorza d’arancia) in uno dei locali sotto i portici di Piazza Vittorio.</p>", "must": [], "curio": "Il vermouth nacque a Torino nel 1786, nella bottega di Antonio Benedetto Carpano in Piazza Castello. E alla Gran Madre è legata una leggenda: la statua della Fede, a sinistra della scalinata, con il suo sguardo indicherebbe il punto in cui sarebbe nascosto il Santo Graal.", "info": [["Tempo", "1 h"], ["Aperitivo", "~€10–15 con stuzzichini"], ["Terreno", "Piano; scalinata della chiesa"]], "maps": "Chiesa Gran Madre di Dio Torino", "gem": false, "kind": "aperitivo", "ll": [45.0623, 7.6988], "links": [], "wiki": "granmadre"}, {"type": "note", "title": "Sabato sera: due possibilità, ancora da decidere", "text": "Le due opzioni non cambiano il resto della giornata. Con il nuovo programma, scegliendo l’opzione B si arriva a Stupinigi dopo le 18: la Palazzina si ammira dall’esterno, illuminata, prima di cena. Chi volesse visitarne anche gli interni deve prenotare la Mole alle 15:30 e rinunciare a Farmacia del Cambio e grissini."}, {"type": "resto", "time": "19:30", "kind": "Cena · Opzione A", "title": "Cena in centro a Torino", "options": [{"name": "Porto di Savona", "where": "Piazza Vittorio Veneto 2 · tel. 011 817 3500", "desc": "Sale su due piani con arredi ottocenteschi e vecchie fotografie, cucina piemontese classica: vitello tonnato, agnolotti, bollito, bonet. Proprio sopra il parcheggio.", "meta": "Aperto tutti i giorni 19:30–22:30 · ~€40–50", "maps": "Porto di Savona Piazza Vittorio Veneto 2 Torino", "ll": [45.0656, 7.6931]}, {"name": "Tre Galline", "where": "Via Bellezia 37 (Quadrilatero) · 10 min a piedi", "desc": "Un bastione della tradizione, sale rivestite di legno e il carrello dei bolliti e dei formaggi che passa tra i tavoli. Più “da occasione”, ancora nella fascia di budget scegliendo bene.", "meta": "Sabato 19:30–23:00 · ~€45–55", "maps": "Tre Galline Via Bellezia 37 Torino", "ll": [45.0749, 7.6793]}], "note": "Rientro al B&B: ~85 km, 1 h 15 (arrivo verso le 23:15)."}, {"type": "stop", "time": "18:30", "title": "Opzione B · Palazzina di Caccia di Stupinigi", "place": "Piazza Principe Amedeo 7, Nichelino · 10 km dal centro", "desc": "<p>Il “padiglione di caccia” dei Savoia, capolavoro di Juvarra (1729): una pianta a croce di Sant’Andrea che si apre sul parco come un ventaglio, e al centro un salone ovale altissimo, affrescato con scene di caccia alla dea Diana. Sulla cupola svetta un <b>cervo di bronzo</b> (l’originale è custodito all’interno). Fa parte del sito UNESCO delle Residenze Sabaude.</p><p>Lasciando Torino dopo la Mole (verso le 17:50, saltando la Gran Madre) si arriva con le ultime luci: si passeggia davanti alla facciata e al viale d’accesso con la palazzina illuminata, poi si cena a due passi. Da qui il rientro al B&amp;B è più breve.</p>", "must": [], "curio": "Qui dormì Napoleone nel 1805, diretto a Milano per l’incoronazione a re d’Italia; nel museo è esposta una sontuosa carrozza di gala che, secondo la tradizione, lo accompagnò.", "info": [["Orari", "Interni sab 10:00–18:30 (ultimo ingresso ~1 h prima)"], ["Costo", "Esterno gratuito · interni ~€12"], ["Tempo", "30 min (esterno)"], ["Terreno", "Piano, accessibile"], ["Rientro", "Stupinigi → Treiso ~75 km, 1 h"]], "maps": "Palazzina di Caccia di Stupinigi", "gem": false, "kind": "visita", "ll": [44.9953, 7.6037], "links": [["Orari e biglietti", "https://www.ordinemauriziano.it"]], "wiki": "stupinigi"}, {"type": "resto", "time": "20:00", "kind": "Cena · Opzione B", "title": "Cena a Stupinigi", "options": [{"name": "Ristorante Sabaudia", "where": "Viale Torino 11, Stupinigi · tel. 011 358 0119", "desc": "Di fronte alla Palazzina, in uno degli edifici del borgo storico. Cucina piemontese con attenzione alla stagione. Verificare il menu e la fascia di prezzo al momento della prenotazione.", "meta": "Sabato cena 20:00–21:30 (ultimo ordine) · da verificare", "maps": "Ristorante Sabaudia Stupinigi", "ll": [44.9967, 7.603]}], "note": "Rientro al B&B: ~75 km, 1 h (arrivo verso le 23:00)."}], "timeline": [["08:40", "Partenza"], ["09:45", "Mirafiori (in auto)"], ["10:00", "Lingotto · Pista 500"], ["11:10", "P.za Vittorio"], ["11:30", "P.za Castello"], ["12:00", "Duomo"], ["12:20", "Porta Palazzo"], ["13:00", "Pranzo"], ["14:40", "Consolata · Bicerin"], ["15:20", "Carignano · Farmacia"], ["16:10", "Grissini · S. Carlo"], ["16:45", "Mole"], ["17:50", "Gran Madre"]], "budget": {"rows": [["Parcheggi (per auto, da dividere)", "~€25–30"], ["Pista 500", "~€3–4"], ["Caffè, bicerin e Farmacia del Cambio", "~€20"], ["Grissini da portare a casa", "~€5"], ["Pranzo", "€30–45"], ["Ascensore della Mole", "€9"], ["Aperitivo", "€10–15"], ["Cena", "€40–50"]], "total": "~€120–155"}}, {"num": 3, "date": "Domenica 18 ottobre", "title": "Tartufo, Barolo e castelli", "route": "Treiso → Alba → La Morra → Barolo → Serralunga → Padova", "stats": [["~430 km", "in auto"], ["~4 km", "a piedi"], ["~22:30", "arrivo a Padova"], ["Leggero", "calici"]], "items": [{"type": "stop", "time": "09:15", "title": "Alba, la città delle cento torri", "place": "Centro storico · Via Vittorio Emanuele (“Via Maestra”)", "desc": "<p>Capitale delle Langhe, città romana (<i>Alba Pompeia</i>), poi medievale: nel Medioevo le famiglie nobili vi innalzarono decine di torri, e ancora oggi se ne contano diverse nel profilo della città. Arriviamo presto, perché la domenica della Fiera del Tartufo il centro si riempie già a metà mattina e i parcheggi finiscono in fretta.</p><p>Si passeggia lungo la <b>Via Maestra</b>, tra pasticcerie, salumerie e negozi di tartufi, fino a <b>Piazza Risorgimento</b> con il <b>Duomo di San Lorenzo</b> (all’interno, lo splendido coro ligneo intarsiato del Cinquecento) e le torri medievali che la sovrastano.</p>", "must": ["Il Duomo e il coro ligneo intarsiato", "Le torri di Piazza Risorgimento", "Una sosta in una pasticceria storica per la <i>torta di nocciole</i>"], "curio": "Alba è la città della Ferrero: qui nel dopoguerra Pietro Ferrero inventò la pasta di nocciole che nel 1964 diventò la Nutella. Il profumo di nocciola tostata, in certi giorni, arriva fino in centro.", "info": [["Parcheggio", "Zone attorno al centro (ZTL all’interno): arrivare entro le 9:15"], ["Distanza", "Treiso → Alba ~8 km, 15 min"], ["Tempo", "Mattinata intera"], ["Terreno", "Piano, pedonale"]], "maps": "Piazza Risorgimento Alba", "gem": false, "kind": "passeggiata", "ll": [44.7002, 8.035], "links": [], "wiki": "alba"}, {"type": "stop", "time": "09:30", "title": "Mercato Mondiale del Tartufo Bianco", "place": "Cortile della Maddalena, Via Vittorio Emanuele", "desc": "<p>Dal 10 ottobre al 6 dicembre 2026 Alba ospita la <b>96ª Fiera Internazionale del Tartufo Bianco</b>, e il cuore della Fiera è il Mercato Mondiale, aperto il sabato e la domenica. Qui i <i>trifolau</i> (i cercatori) e i commercianti espongono i tartufi appena raccolti, dopo il controllo di una Commissione Qualità che ne verifica ogni esemplare.</p><p>Anche se non si compra nulla, vale la visita per il profumo (inconfondibile) e per imparare a riconoscere un buon tartufo: si osservano forma, colore, consistenza. Attorno ci sono banchi di formaggi, nocciole, vini e prodotti del territorio.</p>", "must": ["Farsi spiegare da un trifolau come si valuta un tartufo", "Gli assaggi di nocciola Tonda Gentile e di formaggi di Langa"], "curio": "Il tartufo bianco d’Alba (<i>Tuber magnatum Pico</i>) non si coltiva: cresce solo spontaneamente, sotto querce, pioppi e tigli, e si trova solo con l’aiuto dei cani. La stagione della cerca si apre ufficialmente a mezzanotte tra il 30 settembre e il 1° ottobre.", "info": [["Orari", "Sab e dom, dal mattino (verificare sul sito della Fiera)"], ["Costo", "Ingresso a pagamento, modesto"], ["Tempo", "45 min"], ["Info", "fieradeltartufo.org"]], "maps": "Cortile della Maddalena Alba", "gem": false, "kind": "visita", "ll": [44.6993, 8.034], "links": [["Programma della Fiera", "https://www.fieradeltartufo.org"]], "wiki": "tartufo"}, {"type": "stop", "time": "10:00", "title": "Alba Sotterranea", "place": "Ritrovo: Ufficio Turistico, Piazza Risorgimento 2", "desc": "<p>Sotto le strade dello “struscio” albese dorme una città intera. La visita, guidata da un archeologo, scende in tre dei 32 siti del percorso archeologico cittadino: resti di strade romane, mura, fondamenta di templi e di torri medievali scomparse, a pochi metri sotto i negozi. I siti cambiano da una data all’altra e il percorso si conclude al Museo Civico Federico Eusebio.</p><p>Una visita che pochi turisti conoscono e che dà tutto un altro sguardo sulla città. Durante la Fiera si svolge ogni sabato e domenica di ottobre e novembre.</p>", "must": [], "curio": "Molti ingressi ai sotterranei si trovano dentro edifici privati: cantine di palazzi, il caveau di una banca, cripte di chiese. Senza guida è impossibile accedervi.", "info": [["Orari", "Turni mattina e pomeriggio, su prenotazione"], ["Costo", "€13"], ["Tempo", "~1 h 30"], ["Terreno", "Scale per scendere e risalire in alcuni siti"], ["Prenotare", "339 7349949 · info@ambientecultura.it"]], "maps": "Ufficio Turistico Piazza Risorgimento 2 Alba", "gem": true, "kind": "visita", "ll": [44.7005, 8.0353], "links": [["Prenota la visita", "https://www.ambientecultura.it"]], "wiki": "albasott"}, {"type": "drive", "text": "Alba → La Morra · ~14 km · 25 min, salendo tra i vigneti del Barolo. Osservate i filari: a metà ottobre si vendemmia il <b>Nebbiolo</b>, l’ultima uva a essere raccolta. Con un po’ di fortuna vedrete le cassette rosse e i trattori carichi d’uva."}, {"type": "resto", "time": "12:30", "kind": "Pranzo", "title": "Pranzo a La Morra (o ad Alba)", "options": [{"name": "Osteria More e Macine", "where": "Via XX Settembre 18, La Morra · tel. 0173 500395", "desc": "Osteria semplice e molto amata nel centro di La Morra, a cinque minuti a piedi dal Belvedere. Cucina di Langa senza fronzoli, ottima selezione di vini del territorio.", "meta": "~€30–40 · verificare apertura domenicale", "maps": "Osteria More e Macine La Morra", "ll": [44.6379, 7.9331]}, {"name": "Osteria dell’Arco (Alba)", "where": "Piazza Michele Ferrero 5, Alba", "desc": "Storica osteria Slow Food nel cuore di Alba, cucina langarola con materie prime di stagione. Di solito chiusa la domenica, ma in ottobre e novembre apre anche la domenica: comoda se si resta ad Alba più a lungo.", "meta": "~€45", "maps": "Osteria dell'Arco Alba", "ll": [44.6989, 8.0357]}], "note": null}, {"type": "stop", "time": "14:15", "title": "Il Belvedere di La Morra", "place": "Piazza Castello, La Morra", "desc": "<p>La Morra è chiamata il <b>“balcone delle Langhe”</b>. Dal Belvedere, dove un tempo sorgeva il castello, lo sguardo abbraccia quasi tutta la zona del Barolo: i paesi di Barolo, Castiglione Falletto, Serralunga e Monforte appoggiati sulle creste, e sotto il mosaico dei vigneti che in ottobre si colora di rosso e oro. Nelle giornate limpide, sullo sfondo, il Monviso e le Alpi.</p>", "must": [], "curio": "Nel paesaggio si riconoscono i nomi delle vigne più celebri, i <i>cru</i> del Barolo: Brunate, Cerequio, Rocche dell’Annunziata. Ogni collina ha il suo carattere, e i produttori ne scrivono il nome in etichetta.", "info": [["Costo", "Gratuito"], ["Tempo", "20–30 min"], ["Terreno", "Piazza pianeggiante, panchine"]], "maps": "Belvedere La Morra", "gem": false, "kind": "passeggiata", "ll": [44.6391, 7.9322], "links": [], "wiki": "lamorra"}, {"type": "drive", "text": "La Morra → Cappella del Barolo · ~3 km · 7 min (frazione Annunziata / vigneto Brunate)."}, {"type": "stop", "time": "14:45", "title": "La Cappella del Barolo", "place": "Località Brunate, La Morra", "desc": "<p>Una piccola cappella costruita nel 1914 come riparo per i vignaioli sorpresi dalla grandine, mai consacrata. Nel 1999 la famiglia Ceretto, proprietaria della vigna, chiese a due artisti di fama mondiale, l’americano <b>Sol LeWitt</b> e l’inglese <b>David Tremlett</b>, di ridipingerla. Il risultato è un’esplosione di colori accesi, geometrici, sorprendente in mezzo ai filari: è diventata una delle immagini più fotografate delle Langhe.</p>", "must": ["La foto con i filari davanti e la cappella sullo sfondo", "Gli interni di Tremlett, visibili attraverso la porta a vetri"], "curio": "Gli artisti non vollero alcun compenso: chiesero soltanto di poter tornare nelle Langhe quando volevano, ospiti dei Ceretto, per mangiare e bere bene.", "info": [["Costo", "Gratuito"], ["Tempo", "20 min"], ["Terreno", "Ultimo tratto su breve strada bianca; piccolo parcheggio"], ["Nota", "Si ammira dall’esterno"]], "maps": "Cappella del Barolo Brunate La Morra", "gem": true, "kind": "visita", "ll": [44.6252, 7.9397], "links": [], "wiki": "cappella"}, {"type": "drive", "text": "Cappella → Barolo · ~5 km · 10 min. Parcheggio in Piazza Colbert, a due minuti dal castello."}, {"type": "stop", "time": "15:15", "title": "Barolo, il paese del re dei vini", "place": "Castello Falletti · Piazza Falletti", "desc": "<p>Il paese che ha dato il nome al vino è un borgo raccolto attorno al <b>Castello Falletti</b>, che fu dimora degli ultimi marchesi di Barolo. Fu proprio la marchesa <b>Giulia Colbert Falletti</b>, francese d’origine, a promuovere a metà Ottocento il Barolo come vino secco da invecchiamento, sul modello dei grandi rossi francesi. La leggenda vuole che ne abbia mandate 325 botti al re Carlo Alberto, una per ogni giorno dell’anno esclusa la Quaresima: da qui il motto <i>“il re dei vini, il vino dei re”</i>.</p><p>Un giro tra le vie, la facciata del castello e le enoteche. Chi ha tempo e voglia può curiosare nel piccolo <b>Museo dei Cavatappi</b>, con centinaia di esemplari dal Settecento a oggi.</p>", "must": ["Il castello e la vista dalla piazza", "Il Museo dei Cavatappi (piccolo, curioso)", "Comprare una bottiglia da portare a casa all’Enoteca Regionale del Barolo, nelle cantine del castello"], "curio": "Nel castello lavorò come bibliotecario Silvio Pellico, l’autore de <i>Le mie prigioni</i>, accolto dai marchesi dopo gli anni di carcere allo Spielberg.", "info": [["Tempo", "45 min"], ["Terreno", "Qualche salita lastricata"], ["Alternativa", "WiMu, museo del vino nel castello: ~€9–10, 1 h 15. Chi lo sceglie salta Serralunga"]], "maps": "Castello Falletti Barolo", "gem": false, "kind": "passeggiata", "ll": [44.6108, 7.9429], "links": [], "wiki": "falletti"}, {"type": "stop", "time": "", "title": "Alternativa · WiMu, il Museo del Vino", "place": "Castello Falletti, Barolo", "desc": "<p>Un percorso scenografico di 25 sale su cinque piani, dalla terrazza alle cantine, progettato da François Confino, lo stesso scenografo del Museo del Cinema nella Mole: sabato avrete visto il “fratello maggiore”. Luci, suoni e installazioni raccontano il vino attraverso la storia, l’arte, il cinema e la cucina, e comprende gli appartamenti storici dei marchesi.</p>", "must": [], "curio": null, "info": [["Orari", "Tutti i giorni, ~10:30–19:00"], ["Costo", "~€9–10"], ["Tempo", "1 h 15"], ["Terreno", "Scale tra i piani"]], "maps": "WiMu Museo del Vino Barolo", "gem": false, "kind": "visita", "ll": [44.6106, 7.9427], "links": [["Sito del museo", "https://www.wimubarolo.it"]], "wiki": "wimu"}, {"type": "drive", "text": "Barolo → Serralunga d’Alba · ~10 km · 20 min."}, {"type": "stop", "time": "16:15", "title": "Il Castello di Serralunga d’Alba", "place": "Via Castello, Serralunga d’Alba", "desc": "<p>Da lontano sembra uscito da un libro di fiabe: un corpo alto e stretto, una torre cilindrica, una torretta pensile, tutto in cima a un borgo circolare. Costruito verso la metà del Trecento dai Falletti, è uno dei castelli nobiliari meglio conservati del Piemonte e un caso unico in Italia: ha la forma di un <b>donjon</b> francese, la torre-residenza fortificata tipica della Francia medievale.</p><p>La visita guidata attraversa i passaggi difensivi, la cappella con affreschi e la sala del Valletto, fino in cima, da dove si domina il paesaggio di Serralunga, la zona che dà i Barolo più austeri e longevi.</p>", "must": [], "curio": "Il castello non fu mai conquistato: la sua forza era proprio la verticalità, con l’accesso al piano nobile possibile solo attraverso passaggi sopraelevati facilmente difendibili.", "info": [["Orari", "Solo visite guidate, turni circa ogni 45 min; ultimo verso le 16:45–17:30"], ["Costo", "~€6–8"], ["Tempo", "45 min"], ["Terreno", "Molte scale, anche strette e ripide"], ["Prenotare", "0173 613358 (consigliato)"]], "maps": "Castello di Serralunga d'Alba", "gem": false, "kind": "visita", "ll": [44.61, 8.0003], "links": [], "wiki": null}, {"type": "resto", "time": "17:15", "kind": "Merenda sinoira", "title": "Ultima sosta prima del viaggio", "options": [{"name": "Vinoteca Centro Storico", "where": "Via Roma 6, Serralunga d’Alba · tel. 0173 613203", "desc": "Locale piccolo e rustico con le pareti coperte di bottiglie, frequentato da gente del posto. Il titolare affetta salumi e prepara taglieri di formaggi, con una carta dei vini enciclopedica. Perfetto per una merenda sinoira prima dell’autostrada.", "meta": "Verificare l’orario domenicale · ~€20–30", "maps": "Vinoteca Centro Storico Serralunga d'Alba", "ll": [44.6094, 8.0008]}], "note": "La <b>merenda sinoira</b> è una tradizione contadina piemontese: uno spuntino abbondante di fine pomeriggio (salumi, formaggi, acciughe al verde, pane e un bicchiere) che faceva da ponte tra il pranzo e una cena leggera. Per chi guida: acqua frizzante e un assaggio al massimo."}, {"type": "stop", "time": "18:15", "title": "Rientro a Padova", "place": "Via Alba, A33 e A21, poi A4", "desc": "<p>Circa 400 km, 4 ore e 15 senza traffico: Serralunga → Alba → autostrada A33 verso Asti, poi A21 verso Piacenza e Brescia, e A4 fino a Padova. Arrivo previsto intorno alle 22:30. Una sosta a metà strada per sgranchirsi le gambe e, magari, cambiare autista.</p>", "must": [], "curio": null, "info": [["Distanza", "~400 km"], ["Tempo", "~4 h 15"], ["Arrivo", "~22:30"]], "maps": null, "gem": false, "kind": "viaggio", "links": [], "wiki": null}], "timeline": [["08:45", "Check-out"], ["09:15", "Alba e Fiera"], ["10:00", "Alba Sotterranea"], ["12:30", "Pranzo La Morra"], ["14:15", "Belvedere"], ["14:45", "Cappella del Barolo"], ["15:15", "Barolo"], ["16:15", "Serralunga"], ["17:15", "Merenda sinoira"], ["18:15", "Rientro"]], "budget": {"rows": [["Mercato del Tartufo", "pochi €"], ["Alba Sotterranea", "€13"], ["Pranzo", "€30–45"], ["Castello di Serralunga (o WiMu)", "€6–10"], ["Merenda sinoira", "€20–30"], ["Pedaggi e carburante (per auto)", "~€90 / auto"]], "total": "~€70–100"}}], "facts": [{"n": "1", "t": "Ai piedi dei monti", "p": "Il nome viene dal latino medievale <i>pedemontium</i>, “ai piedi dei monti”: la regione è circondata su tre lati dalle Alpi e dagli Appennini. Il Po nasce qui, ai piedi del Monviso, e attraversa Torino."}, {"n": "2", "t": "La prima capitale", "p": "Dal 1861 al 1865 Torino fu la prima capitale del Regno d’Italia. Poi toccò a Firenze e infine a Roma. Per quasi mille anni era stata la casa dei Savoia."}, {"n": "3", "t": "“Bogia nen”", "p": "I piemontesi sono soprannominati <i>bogia nen</i>, “non muoverti”. Più che pigrizia indica testardaggine: la tradizione lo fa risalire alla battaglia dell’Assietta del 1747, quando le truppe sabaude ricevettero l’ordine di non arretrare di un passo. E vinsero."}, {"n": "4", "t": "Il primo cioccolatino incartato", "p": "Il <b>gianduiotto</b> nacque a Torino nel 1865, durante il Carnevale, e fu il primo cioccolatino al mondo a essere venduto incartato. Il nome viene da Gianduja, la maschera di Torino. Le nocciole nella pasta? Un modo per risparmiare sul cacao, che costava carissimo."}, {"n": "5", "t": "Hollywood prima di Hollywood", "p": "All’inizio del Novecento Torino era la capitale del cinema italiano: qui nel 1914 fu girato <i>Cabiria</i>, un kolossal che influenzò i registi americani. Non è un caso che il Museo del Cinema stia nella Mole."}, {"n": "6", "t": "Città di motori", "p": "A Torino sono nate Fiat (1899) e Lancia (1906), e qui lavorano ancora grandi carrozzieri e designer come Pininfarina e Giugiaro. Mezza storia dell’automobile italiana è passata per queste strade."}, {"n": "7", "t": "Un paesaggio patrimonio dell’umanità", "p": "Nel 2014 le colline di Langhe, Roero e Monferrato sono diventate patrimonio UNESCO: non un monumento, ma un paesaggio intero modellato da secoli di lavoro dei vignaioli. Il primo paesaggio vitivinicolo italiano a ottenere questo riconoscimento."}, {"n": "8", "t": "Il vino della nebbia", "p": "Il <b>Nebbiolo</b>, l’uva di Barolo e Barbaresco, prende il nome dalla nebbia: matura tardi e si vendemmia a ottobre, quando al mattino le valli sono avvolte nella foschia. Lo vedrete con i vostri occhi."}, {"n": "9", "t": "La culla dello Slow Food", "p": "Il movimento Slow Food è nato a <b>Bra</b> nel 1986, per iniziativa di Carlo Petrini. A pochi chilometri, a Pollenzo, c’è la prima Università di Scienze Gastronomiche al mondo."}, {"n": "10", "t": "Il re dei tartufi", "p": "Il mito del tartufo d’Alba nel mondo si deve a Giacomo Morra, albergatore e ristoratore che dagli anni Trenta ebbe l’idea geniale di regalare ogni anno il tartufo più bello a presidenti, attori e divi di Hollywood. Una trovata pubblicitaria di quasi un secolo fa che funziona ancora."}, {"n": "11", "t": "La patria della Nutella", "p": "Nel dopoguerra, ad Alba, il pasticcere Pietro Ferrero vendeva un “panetto” di pasta di nocciole da tagliare a fette. Divenne spalmabile, poi nel 1964 prese il nome di Nutella. Ferrero ha ancora ad Alba la sua sede storica."}, {"n": "12", "t": "Il vermouth della porta accanto", "p": "A Pessione, vicino a Chieri, dal 1864 ha sede la Martini &amp; Rossi: il vermouth torinese è diventato uno dei marchi italiani più conosciuti al mondo, simbolo dell’aperitivo."}, {"n": "13", "t": "Le panchine giganti", "p": "In Langa spuntano decine di panchine enormi e colorate su cui ci si sente bambini. L’idea è di Chris Bangle, designer americano ex capo dello stile BMW, che vive a Clavesana: lì nel 2010 installò la prima."}, {"n": "14", "t": "La città magica", "p": "Secondo una leggenda molto amata, Torino sarebbe al vertice di due triangoli: quello della magia bianca (con Lione e Praga) e quello della magia nera (con Londra e San Francisco). Ci sono persino tour notturni dedicati."}, {"n": "15", "t": "Una panchina e un pallone", "p": "La Juventus nacque nel 1897 da un gruppo di studenti del liceo D’Azeglio, seduti, racconta la tradizione, su una panchina di corso Re Umberto. Nel 1906, anche grazie a una scissione di ex juventini, nacque il Torino."}, {"n": "16", "t": "Il Grande Torino", "p": "Negli anni Quaranta il Torino vinse cinque scudetti di fila. Il 4 maggio 1949 l’aereo che riportava la squadra da Lisbona si schiantò contro la basilica di Superga: ancora oggi, ogni anno, i tifosi salgono lassù a ricordarli."}, {"n": "17", "t": "Il museo più antico dell’Egitto", "p": "Il Museo Egizio di Torino, fondato nel 1824, è il più antico al mondo interamente dedicato all’Egitto. Il geroglifista Champollion ci lavorò e disse che la strada per Menfi e Tebe passava da Torino."}, {"n": "★", "t": "Tra i primi DOCG d’Italia", "p": "Nel 1980 Barolo e Barbaresco furono tra i primissimi vini italiani a ricevere la DOCG, il riconoscimento più alto. Il Barolo può nascere in soli 11 comuni, il Barbaresco in 3 comuni più una frazione di Alba."}, {"n": "★", "t": "Botte grande o barrique?", "p": "Negli anni Ottanta i “Barolo Boys” introdussero le piccole barrique francesi, i tradizionalisti restarono fedeli alle grandi botti di rovere. Fu una vera guerra di famiglie. Oggi convivono entrambi gli stili: chiedetelo in cantina, è un ottimo argomento di conversazione."}, {"n": "★", "t": "Il nome in etichetta", "p": "Molte bottiglie riportano il nome di una singola vigna (MGA): Brunate, Cannubi, Rabajà, Asili. È come un “indirizzo” del vino. Il Cannubi, a Barolo, compariva già su etichette dell’Ottocento."}, {"n": "★", "t": "Ottobre in vigna", "p": "A metà ottobre la vendemmia del Nebbiolo è agli sgoccioli e nelle cantine si sente l’odore del mosto in fermentazione. Le foglie delle viti diventano gialle e rosse: è il momento più fotogenico dell’anno."}, {"n": "★", "t": "Un Barolo da farmacia", "p": "Il <b>Barolo Chinato</b> è Barolo aromatizzato con corteccia di china e spezie, nato nell’Ottocento come tonico e digestivo, secondo la tradizione da un farmacista di Serralunga. Si beve a fine pasto, magari con un quadratino di cioccolato fondente."}, {"n": "★", "t": "Il bicchiere giusto", "p": "Il Barolo si serve intorno ai 16–18 °C, in un bicchiere ampio. Una bottiglia importante si apre un’ora prima, o si decanta. Per la cena al B&amp;B: ricordatevi il cavatappi!"}], "steps": [{"n": "1", "t": "Guardare", "p": "Il Nebbiolo ha un colore granato chiaro, quasi trasparente, con riflessi aranciati: non aspettatevi un rosso cupo. Più il vino è vecchio, più vira verso l’arancio."}, {"n": "2", "t": "Ruotare", "p": "Far girare il vino nel bicchiere lo ossigena e libera i profumi. Le “lacrime” sulle pareti indicano alcol e struttura."}, {"n": "3", "t": "Annusare", "p": "Nel Barolo cercate rosa, viola, ciliegia, liquirizia, tabacco. Il classico descrittore è “catrame e rose”."}, {"n": "4", "t": "Assaggiare", "p": "Il Nebbiolo “asciuga” la bocca: è il tannino. È normale, ed è ciò che gli permette di invecchiare decenni. Con un piatto di carne diventa morbido."}], "shop": [{"what": "Grissini stirati e rubatà", "why": "Il pane di Torino, dal 1679. Durano settimane.", "where": "Perino Vesco o Porta Palazzo (sab)"}, {"what": "Gianduiotti", "why": "Il cioccolatino incartato più antico del mondo.", "where": "Galleria Subalpina, Farmacia del Cambio (sab)"}, {"what": "Nocciole Tonda Gentile", "why": "Tostate, sgusciate o in pasta: la nocciola più pregiata.", "where": "Mercato del Tartufo, pasticcerie di Alba (dom)"}, {"what": "Torta di nocciole e torrone", "why": "Il dolce di Langa e il torrone alle nocciole tipico di Alba.", "where": "Alba, Via Maestra (dom)"}, {"what": "Cugnà", "why": "Mostarda d’uva e frutta cotta, preparata in vendemmia. Perfetta con bollito e formaggi.", "where": "Mercato di Alba, botteghe di paese"}, {"what": "Formaggi", "why": "Castelmagno, Bra, Toma, Robiola di Roccaverano.", "where": "Porta Palazzo (sab), Mercato di Alba (dom)"}, {"what": "Moscato d’Asti o Alta Langa", "why": "Per brindare a casa ricordando le cattedrali.", "where": "Canelli (ven)"}, {"what": "Barbaresco e Barolo", "why": "La bottiglia “importante” del viaggio.", "where": "Enoteche regionali di Barbaresco (ven) e Barolo (dom)"}, {"what": "Vermouth di Torino", "why": "Rosso, con una scorza d’arancia: l’aperitivo torinese.", "where": "Enoteche del centro di Torino (sab)"}, {"what": "Barolo Chinato", "why": "Il digestivo più elegante del Piemonte.", "where": "Barolo o Serralunga (dom)"}], "book": [{"u": "Subito", "what": "Cena venerdì · Osteria dell’Unione o Osteria Le Rocche (Treiso)", "when": "Ven 16 · 20:00", "contact": "0173 638303 · 0173 638017"}, {"u": "Subito", "what": "Cena sabato · Torino centro <i>oppure</i> Stupinigi (da decidere)", "when": "Sab 17 · 19:30–20:00", "contact": "vedi Giorno 2"}, {"u": "Subito", "what": "Pranzo domenica · La Morra (o Alba)", "when": "Dom 18 · 12:30", "contact": "0173 500395"}, {"u": "Presto", "what": "Visita Cattedrali Sotterranee · Bosca, Canelli", "when": "Ven 16 · turno ~14:00", "contact": "bosca.it · 0141 967749"}, {"u": "Presto", "what": "Pranzo venerdì · Canelli", "when": "Ven 16 · 12:30", "contact": "333 4888224"}, {"u": "Presto", "what": "Pranzo sabato · Trattoria Valenza, Torino", "when": "Sab 17 · 13:00", "contact": "011 521 3914"}, {"u": "Presto", "what": "Alba Sotterranea (turno del mattino)", "when": "Dom 18 · ~10:00", "contact": "339 7349949"}, {"u": "Online", "what": "Mole Antonelliana · solo ascensore panoramico, fascia oraria", "when": "Sab 17 · 16:45", "contact": "museocinema.it"}, {"u": "Online", "what": "Pista 500 al Lingotto (facoltativo: si compra anche sul posto)", "when": "Sab 17 · 10:00", "contact": "pinacoteca-agnelli.it"}, {"u": "Facolt.", "what": "Castello di Serralunga · visita guidata", "when": "Dom 18 · ~16:00", "contact": "0173 613358"}, {"u": "Facolt.", "what": "Merenda sinoira · Vinoteca Centro Storico, Serralunga", "when": "Dom 18 · ~17:15", "contact": "0173 613203"}], "boxes": [{"t": "Il ritmo del viaggio", "p": "Le giornate sono volutamente piene: ogni tappa ha un tempo consigliato, ma nulla è obbligatorio. Se la stanchezza si fa sentire, le tappe segnate come <i>facoltative</i> si saltano senza rimpianti. Terreni: in prevalenza strade asfaltate e lastricate; dove c’è acciottolato o salita ripida lo trovate indicato alla voce <b>Terreno</b>."}, {"t": "Vino e guida", "p": "Abbiamo scelto sempre le degustazioni più leggere (un calice o due). Un buon trucco: <b>una degustazione ogni coppia, condivisa</b>, e le bottiglie che piacciono si comprano da bere con calma la sera al B&amp;B. In Italia il limite per chi guida è 0,5 g/l."}, {"t": "Meteo e abbigliamento", "p": "Metà ottobre: in genere 8–18 °C, mattine con nebbia nelle valli e giornate limpide sulle colline. Vestirsi “a cipolla”, scarpe comode con suola che tenga sul lastricato bagnato, una giacca anche per le cantine (12–14 °C tutto l’anno)."}, {"t": "Auto e parcheggi", "p": "A Torino e ad Alba il centro storico è <b>ZTL</b>: non entrare con l’auto, usare i parcheggi indicati. Nei borghi delle Langhe si parcheggia all’ingresso del paese e si sale a piedi. Due auto = tenersi in contatto via telefono sugli spostamenti."}, {"t": "Tartufo: come non farsi sorprendere", "p": "Il tartufo bianco si vende e si serve <b>a peso</b>. Al ristorante chiedere sempre il prezzo al grammo e quanti grammi verranno grattati <i>prima</i> che arrivi il piatto. Un buon uovo al tegamino o dei tajarin al burro sono il modo migliore per assaggiarlo."}, {"t": "Numeri utili", "p": "<b>Emergenze: 112</b><br/>B&amp;B Mermaid: annotare qui il numero<br/>____________________<br/>Auto 1: ____________<br/>Auto 2: ____________"}, {"t": "Orari dei pasti", "p": "In Langa le cucine chiudono presto: pranzo entro le 13:30–14:00, cena dalle 19:30 alle 21:30. Meglio arrivare puntuali. Il lunedì e il martedì molti locali sono chiusi (per noi non è un problema)."}, {"t": "Nota su orari e prezzi", "p": "Verificati a fine settembre 2026 su fonti pubbliche. Possono cambiare: riconfermarli al momento della prenotazione. I prezzi dei pasti sono medi a persona, vino escluso salvo diversa indicazione."}, {"t": "Se comprate un tartufo bianco", "p": "Deve essere sodo, profumato e senza parti molli. A casa si conserva in frigorifero, avvolto in carta assorbente da cambiare ogni giorno, in un contenitore chiuso: dura 5–7 giorni al massimo. Non lavatelo: si spazzola solo al momento di usarlo, e si grattugia a crudo su piatti caldi e semplici."}, {"t": "Attenzione alle imitazioni", "p": "Molte salse, oli e burri “al tartufo” in vendita sono aromatizzati artificialmente. Leggete l’etichetta: se tra gli ingredienti compare “aroma”, il tartufo vero è poco o niente. Meglio pochi grammi di tartufo fresco che un vasetto di aroma."}, {"t": "Per continuare il viaggio: da leggere", "p": "<b>Cesare Pavese</b>, <i>La luna e i falò</i>: le colline tra Canelli e Santo Stefano Belbo, che attraverserete venerdì.<br/><b>Beppe Fenoglio</b>, <i>I ventitré giorni della città di Alba</i>: racconti partigiani dello scrittore albese, ironici e amari.<br/><b>Natalia Ginzburg</b>, <i>Lessico famigliare</i>: la Torino borghese e antifascista del Novecento."}, {"t": "… e da vedere", "p": "<b><i>The Italian Job</i></b> (1969): le Mini Cooper sul tetto del Lingotto e tra i portici di Torino.<br/><b><i>Barolo Boys</i></b> (2014): documentario sui giovani produttori che rivoluzionarono il Barolo negli anni Ottanta.<br/><b><i>Cabiria</i></b> (1914): per i più curiosi, il kolossal muto girato a Torino."}], "glossary": [{"title": "In tavola", "items": [{"t": "Agnolotti del plin", "d": "Piccoli ravioli ripieni di carne, chiusi con un “pizzicotto” (<i>plin</i>). Al burro e salvia o al sugo d’arrosto."}, {"t": "Tajarin", "d": "Tagliolini sottilissimi all’uovo, con moltissimi tuorli. Il piatto ideale per il tartufo bianco."}, {"t": "Carne cruda", "d": "Battuta al coltello di vitello Fassone piemontese, con olio, sale e limone."}, {"t": "Vitello tonnato", "d": "Fettine di vitello con salsa di tonno e capperi. In Piemonte si fa “all’antica”, senza maionese."}, {"t": "Brasato al Barolo", "d": "Manzo cotto per ore nel vino rosso. Il piatto delle domeniche d’inverno."}, {"t": "Bagna cauda", "d": "Salsa calda di aglio, acciughe e olio in cui intingere le verdure. Stagione: da ottobre in poi."}, {"t": "Fonduta", "d": "Crema di formaggio fontina, uova e latte, spesso con tartufo."}, {"t": "Bonet", "d": "Budino al cacao e amaretti. Il dolce piemontese per eccellenza."}, {"t": "Torta di nocciole", "d": "Fatta con la Tonda Gentile delle Langhe, la nocciola più pregiata al mondo."}, {"t": "Grissini stirati e rubatà", "d": "Nati a Torino nel 1679. Gli <i>stirati</i> sono tirati a mano, lunghi e sottili; i <i>rubatà</i> sono arrotolati, più corti e rustici."}, {"t": "Bicerin", "d": "Caffè, cioccolato e crema di latte a strati. Solo a Torino."}, {"t": "Merenda sinoira", "d": "Lo spuntino abbondante di fine pomeriggio della tradizione contadina."}]}, {"title": "Nel bicchiere", "items": [{"t": "Barolo", "d": "Da uve Nebbiolo, almeno 38 mesi di invecchiamento. Potente, tannico, profumi di rosa, catrame e spezie."}, {"t": "Barbaresco", "d": "Anch’esso Nebbiolo, più elegante e un po’ più pronto del Barolo. Nasce tra Barbaresco, Neive e Treiso."}, {"t": "Barbera", "d": "Il rosso di tutti i giorni: fresco, succoso, perfetto con i salumi."}, {"t": "Dolcetto", "d": "Nonostante il nome è secco: morbido, profumato di ciliegia."}, {"t": "Moscato d’Asti", "d": "Dolce, poco alcolico, leggermente frizzante. Con i dolci alle nocciole."}, {"t": "Alta Langa", "d": "Spumante metodo classico da Pinot nero e Chardonnay, orgoglio di Canelli."}, {"t": "Vermouth di Torino", "d": "Vino aromatizzato con erbe e spezie, nato nel 1786. Il re dell’aperitivo."}]}, {"title": "Parole utili", "items": [{"t": "Trifolau", "d": "Il cercatore di tartufi, sempre accompagnato dal suo cane."}, {"t": "Cru / MGA", "d": "Il nome della singola vigna scritto in etichetta (es. Brunate, Rabajà)."}, {"t": "Sternia", "d": "Nel dialetto locale, una strada lastricata o acciottolata in salita."}]}, {"title": "Due parole di piemontese", "items": [{"t": "Cerea!", "d": "Il saluto torinese più elegante, per “buongiorno” e “arrivederci”. Deriva da “sire”."}, {"t": "Bogia nen", "d": "“Non muoverti”: il soprannome dei piemontesi, testardi e affidabili."}, {"t": "Neh?", "d": "L’intercalare piemontese per eccellenza, a fine frase: “bello, neh?”"}, {"t": "Piola", "d": "L’osteria semplice di quartiere, con vino della casa e piatti del giorno."}, {"t": "Madamin", "d": "La signora torinese elegante, con cappellino e pasticcini la domenica."}, {"t": "Travet", "d": "L’impiegato: dal protagonista di una commedia torinese dell’Ottocento, Monsù Travet."}, {"t": "Trifola · Tabui", "d": "Il tartufo e il cane da tartufo: spesso un meticcio, ma con un fiuto infallibile."}]}], "quiz": [{"q": "In che anno Torino diventò la prima capitale d’Italia?", "opts": ["1848", "1861", "1870"], "a": 1}, {"q": "Da dove prende il nome l’uva Nebbiolo?", "opts": ["da un paese", "dalla nebbia", "da un nobile francese"], "a": 1}, {"q": "Per chi fu inventato il grissino, nel 1679?", "opts": ["per Napoleone", "per il piccolo Vittorio Amedeo II", "per i soldati sabaudi"], "a": 1}, {"q": "A che altezza corre la pista di collaudo sul tetto del Lingotto?", "opts": ["12 metri", "28 metri", "55 metri"], "a": 1}, {"q": "Quali sono i tre ingredienti del bicerin?", "opts": ["caffè, cioccolato, crema di latte", "caffè, zabaione, panna", "cioccolato, nocciole, latte"], "a": 0}, {"q": "Quale moneta italiana raffigura la Mole Antonelliana?", "opts": ["1 euro", "20 centesimi", "2 centesimi"], "a": 2}, {"q": "In quale anno nacque a Canelli il primo spumante italiano?", "opts": ["1865", "1901", "1946"], "a": 0}, {"q": "Quale di questi paesi NON fa parte della zona del Barbaresco?", "opts": ["Neive", "Treiso", "La Morra"], "a": 2}, {"q": "Chi dipinse la Cappella del Barolo?", "opts": ["Sol LeWitt e David Tremlett", "Andy Warhol", "Keith Haring e Mario Merz"], "a": 0}, {"q": "Cosa significa “bogia nen”?", "opts": ["buon appetito", "non muoverti", "vino nuovo"], "a": 1}, {"q": "Per chi era stata progettata in origine la Mole Antonelliana?", "opts": ["per il Re", "per la comunità ebraica, come sinagoga", "come museo"], "a": 1}, {"q": "Come si chiama il cane da tartufo in piemontese?", "opts": ["tabui", "trifolau", "madamin"], "a": 0}], "quote": "«Le colline di Langa, a ottobre, sembrano un tappeto steso ad asciugare: rosso di Nebbiolo, oro di Moscato, verde scuro di noccioleti.»", "base": {"name": "B&B Mermaid", "addr": "Via Meruzzano 16/a, 12050 Treiso (CN)", "ll": [44.6795, 8.0968], "maps": "Via Meruzzano 16 Treiso"}, "dates": ["2026-10-16", "2026-10-17", "2026-10-18"], "areas": [{"id": "canelli", "name": "Canelli e il Moscato", "when": "Venerdì mattina", "color": "#B8862E", "eat": [{"name": "Ristorante San Marco", "where": "Via Alba 136, Canelli", "maps": "Ristorante San Marco Via Alba 136 Canelli", "ll": [44.717, 8.28], "desc": "Insegna storica dell’Astigiano con oltre settant’anni di attività: sala classica, agnolotti del plin, bonet e zabaione al Moscato. Segnalato dalla Guida Michelin.", "meta": "Venerdì 12:30–14:00 · €€", "tel": null}, {"name": "I Tre Poggi", "where": "Regione Merlini 22, Canelli", "maps": "Ristorante I Tre Poggi Canelli", "ll": [44.729, 8.27], "desc": "Ristorante sulle colline appena fuori Canelli, cucina del territorio. Utile perché a pranzo serve fino al primo pomeriggio.", "meta": "Venerdì dalle 12:30 · da verificare", "tel": null}], "see": [{"name": "Casa natale di Cesare Pavese", "where": "Santo Stefano Belbo · 15 min da Canelli", "maps": "Fondazione Cesare Pavese Santo Stefano Belbo", "ll": [44.709, 8.23], "wiki": "pavese", "desc": "La casa dove nacque lo scrittore nel 1908 e il museo della Fondazione Pavese, nel paese de <i>La luna e i falò</i>. Si trova proprio sulla strada verso Barbaresco.", "time": "45 min"}, {"name": "Castello di Mango e l’Enoteca del Moscato", "where": "Mango · 25 min da Canelli, 15 min dal B&B", "maps": "Castello dei Busca Mango", "ll": [44.686, 8.15], "wiki": "mango", "desc": "Il castello dei Busca, in cima alla collina, ospita l’Enoteca Regionale Colline del Moscato: degustazioni leggere e una delle viste più ampie sulla Langa del Moscato.", "time": "45 min"}, {"name": "Asti, la città delle torri", "where": "Asti · 30 min da Canelli", "maps": "Piazza San Secondo Asti", "ll": [44.9, 8.2065], "wiki": "asti", "desc": "Centro medievale con le torri gentilizie (la Troyana si può salire), la Collegiata di San Secondo e la cattedrale gotica. Asti corre ogni settembre il Palio più antico d’Italia, documentato già nel Duecento.", "time": "1 h 30"}]}, {"id": "barbaresco", "name": "Barbaresco, Neive e Treiso", "when": "Venerdì sera e dintorni del B&B", "color": "#B8862E", "eat": [{"name": "Trattoria Antica Torre", "where": "Via Torino 71, Barbaresco", "maps": "Trattoria Antica Torre Barbaresco", "ll": [44.7258, 8.0822], "tel": "0173 635170", "desc": "Trattoria di famiglia a due passi dalla torre: cucina di Langa tradizionale e tanti Barbaresco dei produttori del paese.", "meta": "~€35–45 · verificare apertura"}, {"name": "Campamac Osteria", "where": "Strada Giro della Valle 1, Barbaresco", "maps": "Campamac Osteria Barbaresco", "ll": [44.7228, 8.086], "tel": "0173 635051", "desc": "Osteria moderna segnalata da Michelin e Gambero Rosso, con dehors e cucina di territorio curata. Un gradino sopra la trattoria classica.", "meta": "€€ · verificare apertura"}, {"name": "Osteria Tastè", "where": "Loc. Tre Stelle, Strada Nicolini Alto 10, Barbaresco", "maps": "Osteria Tastè Barbaresco", "ll": [44.705, 8.07], "tel": "339 2092019", "desc": "Piccola osteria in frazione, a pochi minuti dal B&B, segnalata dal Gambero Rosso. Atmosfera informale, piatti di casa.", "meta": "€€ · verificare apertura"}], "see": [{"name": "Castello di Grinzane Cavour", "where": "Grinzane Cavour · 20 min dal B&B", "maps": "Castello di Grinzane Cavour", "ll": [44.6547, 7.996], "wiki": "grinzane", "desc": "Castello patrimonio UNESCO dove Camillo Benso di Cavour fu sindaco per diciassette anni. Dentro: museo, Enoteca Regionale Piemontese e, a novembre, l’Asta Mondiale del Tartufo Bianco.", "time": "1 h"}, {"name": "Università dei cani da tartufo", "where": "Roddi · 20 min dal B&B", "maps": "Università dei cani da tartufo Roddi", "ll": [44.68, 7.975], "wiki": "roddi", "desc": "Dal 1880 a Roddi si addestrano i cani da tartufo: una “università” nata da un trifolau soprannominato Barot. Dimostrazioni solo su prenotazione, da chiedere con qualche giorno di anticipo.", "time": "1 h"}, {"name": "Castello di Govone", "where": "Govone · 30 min dal B&B", "maps": "Castello di Govone", "ll": [44.804, 8.096], "wiki": "govone", "desc": "Residenza sabauda patrimonio UNESCO, poco conosciuta: saloni affrescati e una sala con rare carte da parati cinesi del Settecento.", "time": "1 h"}]}, {"id": "torino", "name": "Torino", "when": "Sabato", "color": "#7A2233", "eat": [{"name": "Consorzio", "where": "Via Monte di Pietà 23 · Quadrilatero", "maps": "Ristorante Consorzio Via Monte di Pietà 23 Torino", "ll": [45.0717, 7.68], "tel": null, "desc": "Bib Gourmand Michelin: una delle cucine piemontesi più amate dai torinesi, con agnolotti gobbi, ravioli di finanziera e grande carta dei vini piemontesi.", "meta": "Sabato 12:00–14:30 e 19:00–22:30 · €€"}, {"name": "Cianci Piola Caffè", "where": "Largo IV Marzo 9/b · Quadrilatero", "maps": "Cianci Piola Caffè Torino", "ll": [45.0735, 7.683], "tel": null, "desc": "La piola torinese per eccellenza: tovaglie di carta, piatti tradizionali a prezzi bassi, aperta quasi tutto l’anno. Spesso c’è da aspettare il proprio turno.", "meta": "€ · informale"}, {"name": "Madama Piola", "where": "Via Ormea 6 bis · San Salvario", "maps": "Madama Piola Via Ormea Torino", "ll": [45.0602, 7.6862], "tel": null, "desc": "Bib Gourmand Micheli }
